<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FinCtrl â€” Controle Financeiro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0B;--surface:#141318;--elev:#1C1B22;--line:#272530;
  --primary:#6D28D9;--primary2:#7C3AED;--danger:#DC2626;--ok:#10B981;
  --warn:#F59E0B;--text:#FAFAFA;--muted:#A1A1AA;--muted2:#6B6875;
  --soft:#F87171;--crit:#DC2626;--gold:#FBBF24;--r:14px;--sb:248px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -8%,rgba(109,40,217,.18),transparent 60%),
    radial-gradient(700px 400px at 105% 8%,rgba(220,38,38,.10),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit;font-size:16px}
button{cursor:pointer;background:none;border:0}
a{color:var(--primary2);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2E2B38;border-radius:9px}

#app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:var(--sb);flex:0 0 var(--sb);background:rgba(20,19,24,.86);
  backdrop-filter:blur(12px);border-right:1px solid var(--line);
  padding:22px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.brand-ico{width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(140deg,var(--primary2),var(--danger));
  display:grid;place-items:center;font-weight:800;font-size:17px;
  box-shadow:0 6px 18px rgba(109,40,217,.42)}
.brand b{font-size:17px;letter-spacing:-.3px;display:block}
.brand small{color:var(--muted2);font-size:11px;letter-spacing:.11em;text-transform:uppercase}
.nav-i{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  color:var(--muted);font-weight:500;width:100%;text-align:left;transition:.16s;position:relative}
.nav-i:hover{background:var(--elev);color:var(--text)}
.nav-i.on{background:linear-gradient(90deg,rgba(109,40,217,.28),rgba(109,40,217,.05));color:#fff}
.nav-i.on::before{content:"";position:absolute;left:0;width:3px;height:22px;border-radius:3px;background:var(--primary2)}
.nav-i i{width:20px;text-align:center;font-style:normal;font-size:16px;opacity:.95}
.nav-i .bdg{margin-left:auto;background:var(--warn);color:#291a00;font-size:10.5px;font-weight:800;
  padding:1px 7px;border-radius:999px}
.sp{flex:1}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:15px 24px;background:rgba(10,10,11,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.top h1{font-size:19px;letter-spacing:-.4px;font-weight:700}
.top .sub{color:var(--muted2);font-size:12px}
.wrap{padding:20px 24px 120px;max-width:1280px;width:100%}

/* ===== NAVEGAÃ‡ÃƒO DE MESES ===== */
.mpick{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:11px;
  background:var(--elev);border:1px solid var(--line);font-weight:700;font-size:14.5px;
  min-height:40px;text-transform:capitalize}
.mpick:hover{background:#2A2734;border-color:var(--primary)}
.mpick i{font-style:normal;font-size:10px;color:var(--muted2)}
.mpick .rel{font-weight:500;font-size:12px;color:var(--muted2);margin-left:2px;text-transform:none}
.marr{width:36px;height:36px;border-radius:10px;background:var(--elev);
  border:1px solid var(--line);color:var(--muted);font-size:17px;flex:0 0 36px}
.marr:hover{background:#2A2734;color:#fff}
.mstrip{display:flex;gap:6px;overflow-x:auto;padding:11px 24px 12px;
  scroll-behavior:smooth;scrollbar-width:none;border-bottom:1px solid var(--line);
  background:rgba(10,10,11,.85);backdrop-filter:blur(14px);position:sticky;top:0;z-index:19}
.mstrip::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;min-width:56px;padding:8px 11px;border-radius:11px;
  background:transparent;border:1px solid transparent;color:var(--muted2);
  font-size:12.5px;font-weight:650;text-transform:capitalize;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;justify-content:center}
.mchip:hover{background:var(--elev);color:var(--text)}
.mchip i{font-style:normal;font-size:9.5px;opacity:.6;font-weight:700}
.mchip u{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;
  background:var(--primary2);text-decoration:none}
.mchip.cur{color:var(--primary2)}
.mchip.cur::before{content:"";position:absolute;top:4px;right:6px;width:5px;height:5px;
  border-radius:50%;background:var(--ok)}
.mchip.on{background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(109,40,217,.4)}
.mchip.on u{background:#fff}
.mchip.on i{opacity:.85}
.ypick{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
.ypick b{font-size:19px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mcell{padding:15px 8px;border-radius:12px;background:var(--elev);border:1px solid var(--line);
  font-size:13.5px;font-weight:650;text-transform:capitalize;position:relative;min-height:52px}
.mcell:hover{background:#2A2734;border-color:var(--primary)}
.mcell u{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--primary2);text-decoration:none}
.mcell.cur{border-color:var(--ok);color:#6EE7B7}
.mcell.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}
.mcell.on u{background:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.55fr 1fr}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px;gap:10px;flex-wrap:wrap}
.sec h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
.sec .hint{color:var(--muted2);font-size:12px}

.kpi{position:relative;overflow:hidden}
.kpi .lb{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .vl{font-size:25px;font-weight:750;letter-spacing:-.8px;margin-top:9px;font-variant-numeric:tabular-nums}
.kpi .ft{color:var(--muted2);font-size:12px;margin-top:5px}
.kpi::after{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--bar,var(--primary))}
.pos{color:var(--ok)}.neg{color:var(--soft)}.crit{color:var(--crit)}.pri{color:var(--primary2)}.wrn{color:var(--warn)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  background:var(--elev);border:1px solid var(--line);font-weight:600;font-size:14px;transition:.16s}
.btn:hover{background:#2A2734;border-color:#39354a}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;
  color:#fff;box-shadow:0 4px 14px rgba(109,40,217,.34)}
.btn-p:hover{filter:brightness(1.12)}
.btn-d{background:rgba(220,38,38,.13);border-color:rgba(220,38,38,.4);color:#FCA5A5}
.btn-d:hover{background:rgba(220,38,38,.22)}
.btn-s{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-g{background:var(--ok);border-color:transparent;color:#03231a}

.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--elev);border:1px solid var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted2);font-weight:700;background:var(--elev);white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr:hover{background:rgba(109,40,217,.055)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar-t{height:7px;border-radius:7px;background:#25222E;overflow:hidden}
.bar-f{height:100%;border-radius:7px;transition:width .5s}
.empty{padding:40px 20px;text-align:center;color:var(--muted2);font-size:13.5px}
.empty b{display:block;color:var(--muted);font-size:15px;margin-bottom:5px}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:172px;height:172px;flex:0 0 172px;transform:rotate(-90deg)}
.lg{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px}
.lg-i{display:flex;align-items:center;gap:9px;font-size:13px}
.lg-i span:nth-child(2){flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-i b{font-variant-numeric:tabular-nums}
.lg-i i{font-style:normal;color:var(--muted2);font-size:11.5px;width:38px;text-align:right}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:20px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:6px;height:100%;min-width:0}
.bcol .bv{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bcol .bb{width:100%;max-width:52px;border-radius:7px 7px 0 0;min-height:3px;transition:height .5s}
.bcol .bl{font-size:11px;color:var(--muted2);text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;width:100%}
.lnx{display:flex;margin-top:7px}
.lnx span{flex:1;text-align:center;font-size:10.5px;color:var(--muted2)}
.ring{width:96px;height:96px;transform:rotate(-90deg)}

.ov{position:fixed;inset:0;background:rgba(5,5,7,.76);backdrop-filter:blur(5px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.md{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;
  max-width:520px;box-shadow:0 26px 70px rgba(0,0,0,.66);animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.md-h{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between}
.md-h h3{font-size:17px;letter-spacing:-.3px}
.md-b{padding:22px;display:flex;flex-direction:column;gap:15px;max-height:66vh;overflow-y:auto}
.md-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;width:100%;transition:.16s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--primary2);
  box-shadow:0 0 0 3px rgba(109,40,217,.2)}
.fld .hp{font-size:11.5px;color:var(--muted2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.chk{flex-direction:row;align-items:center;gap:10px}
.chk input{width:19px;height:19px;accent-color:var(--primary2)}
.chk label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 10px 28px rgba(109,40,217,.5);font-size:26px;color:#fff;display:grid;place-items:center}
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:200;
  background:var(--elev);border:1px solid var(--line);padding:12px 18px;border-radius:12px;
  font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s}
.seg{display:flex;gap:5px;background:var(--elev);border:1px solid var(--line);
  padding:4px;border-radius:11px;overflow-x:auto}
.seg button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--primary);color:#fff}
.flt{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.flt select,.flt input{background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;font-size:13.5px}

.hero{background:linear-gradient(135deg,rgba(109,40,217,.22),rgba(20,19,24,.6) 55%,rgba(220,38,38,.10));
  border:1px solid var(--line);border-radius:20px;padding:26px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.30),transparent 70%)}
.hero .hl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;display:flex;align-items:center;gap:8px;position:relative}
.hero .hv{font-size:44px;font-weight:800;letter-spacing:-1.8px;margin:10px 0 4px;
  font-variant-numeric:tabular-nums;line-height:1;position:relative}
.hero .hs{color:var(--muted);font-size:13.5px;position:relative}
.hero .hb{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap;position:relative}
.hero .hb div{min-width:108px}
.hero .hb .k{color:var(--muted2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hero .hb .v{font-size:16.5px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums}

.ins{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);margin-bottom:9px}
.ins .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.ins p{font-size:13.5px;line-height:1.55;color:var(--text)}
.ins p b{font-weight:750}
.ins small{display:block;color:var(--muted2);font-size:12px;margin-top:2px}

.due{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
  background:var(--elev);margin-bottom:8px;flex-wrap:wrap}
.due .d{width:44px;flex:0 0 44px;text-align:center;border-radius:9px;padding:5px 0;background:var(--bg)}
.due .d b{display:block;font-size:16px;font-weight:800;line-height:1}
.due .d span{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}
.due.urg{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.34)}

.zs{padding:34px 22px;text-align:center}
.zs .em{font-size:40px;margin-bottom:12px;display:block}
.zs h4{font-size:16.5px;margin-bottom:7px}
.zs p{color:var(--muted);font-size:13.5px;line-height:1.65;max-width:430px;margin:0 auto 18px}
.zs .steps{max-width:400px;margin:0 auto 18px;text-align:left;display:flex;flex-direction:column;gap:9px}
.zs .st{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--muted)}
.zs .st i{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--primary);
  color:#fff;font-style:normal;font-size:11.5px;font-weight:800;display:grid;place-items:center}

.mbar{display:flex;align-items:center;gap:11px;margin-top:15px;position:relative}
.mbar .t{flex:1;height:8px;border-radius:8px;background:#25222E;overflow:hidden;display:flex}
.mbar .t i{height:100%;display:block}
.mbar span{font-size:11.5px;color:var(--muted2);white-space:nowrap}
.eye{padding:7px 10px;border-radius:9px;background:var(--elev);border:1px solid var(--line);font-size:15px}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.goal-hit{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.alert{border-color:rgba(245,158,11,.4);background:linear-gradient(90deg,rgba(245,158,11,.09),transparent)}

@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g3{grid-template-columns:1fr}}
@media(max-width:760px){
  .sidebar{display:none}
  .wrap{padding:16px 14px 130px}
  .top{padding:12px 14px;gap:8px}
  .top h1{font-size:17px}
  .mstrip{padding:9px 14px 10px}
  .mpick{font-size:13.5px;padding:6px 11px}
  .mpick .rel{display:none}
  .marr{display:none}
  .g4,.g2,.g3{grid-template-columns:1fr}
  .kpi .vl{font-size:22px}
  .hero{padding:20px 17px}
  .hero .hv{font-size:34px}
  .hero .hb{gap:14px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(20,19,24,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--muted2);font-size:9.5px;font-weight:600;border-radius:10px;position:relative}
  .tabbar button i{font-style:normal;font-size:19px}
  .tabbar button.on{color:var(--primary2)}
  .tabbar .bdg{position:absolute;top:2px;right:18%;background:var(--warn);color:#291a00;
    font-size:9px;font-weight:800;padding:0 5px;border-radius:999px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));width:52px;height:52px}
  .ov{align-items:flex-end;padding:0}
  .md{border-radius:22px 22px 0 0;max-height:93vh;max-width:100%;
    animation:sheet .27s cubic-bezier(.32,.72,0,1)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .md-h{position:relative;padding-top:24px}
  .md-h::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:4px;background:#3A3645}
  .md-b{max-height:62vh}
  .md-f{position:sticky;bottom:0;background:var(--surface);
    padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .md-f .btn{flex:1;justify-content:center}
  .btn{min-height:44px}
  .row2{grid-template-columns:1fr}
  th,td{padding:10px 12px;font-size:13px}
  .donut{width:142px;height:142px;flex:0 0 142px}
}

    return DB.all('recurrences').filter(r=>Recur.hits(r,comp)).map(r=>{
      const tx=Recur.posted(r,comp);
      return {r,comp,tx,
        status: tx?'lancado':(Recur.skipped(r,comp)?'pulado':'pendente'),
        data: dateOf(comp,Number(r.diaVencimento)||1)};
    }).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  },
  pending(comp){ return Recur.month(comp).filter(i=>i.status==='pendente'); },
  previsto(comp){
    const p=Recur.pending(comp);
    const sum=t=>r2(p.filter(i=>i.r.tipo===t).reduce((s,i)=>s+(Number(i.r.valor)||0),0));
    return {saida:sum('despesa'),entrada:sum('receita'),n:p.length};
  },
  post(r,comp,valor){
    if(!r||Recur.posted(r,comp)) return null;
    const v=valor!==undefined?valor:(Number(r.valor)||0);
    const data=dateOf(comp,Number(r.diaVencimento)||1);
    if(r.cardId) return DB.insert('purchases',{cardId:r.cardId,personId:r.personId,
      categoryId:r.categoryId,descricao:r.descricao,valorTotal:v,dataCompra:data,
      numParcelas:1,parcelasPagas:0,recurrenceId:r.id,comp});
    return DB.insert('transactions',{tipo:r.tipo,data,descricao:r.descricao,valor:v,
      accountId:r.accountId,categoryId:r.categoryId,personId:r.personId,
      recurrenceId:r.id,comp,observacao:r.observacao});
  },
  unpost(r,comp){
    const t=DB.all('transactions').find(x=>x.recurrenceId===r.id&&x.comp===comp);
    if(t){ DB.remove('transactions',t.id); return; }
    const p=DB.all('purchases').find(x=>x.recurrenceId===r.id&&x.comp===comp);
    if(p) DB.remove('purchases',p.id);
  },
  postAll(comp){
    const p=Recur.pending(comp);
    p.forEach(i=>Recur.post(i.r,comp));
    return p.length;
  },
  autoRun(){
    const now=curYM(); let n=0;
    DB.all('recurrences').filter(r=>r.auto&&r.ativo!==false).forEach(r=>{
      let comp=(r.inicio||'').slice(0,7), k=0;
      if(!comp) return;
      while(ymDiff(now,comp)>=0&&k<120){
        if(Recur.hits(r,comp)&&!Recur.skipped(r,comp)&&!Recur.posted(r,comp)){
          Recur.post(r,comp); n++;
        }
        comp=ymAdd(comp,1); k++;
      }
    });
    return n;
  },
  origem(r){
    const c=r.cardId?DB.get('cards',r.cardId):null;
    const a=r.accountId?DB.get('accounts',r.accountId):null;
    return c?{nome:c.nome,cor:c.cor||'#6D28D9',tipo:'cartÃ£o'}
          :a?{nome:a.nome,cor:a.cor||'#8B5CF6',tipo:'conta'}:null;
  }
};

const Chart={
  donut(items,size=172,thick=23){
    const tot=items.reduce((s,i)=>s+i.value,0);
    if(!tot) return '<div class="empty">Sem dados neste mÃªs</div>';
    const r=(size-thick)/2, c=2*Math.PI*r; let off=0;
    const segs=items.map(i=>{
      const len=c*(i.value/tot);
      const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${i.color}"
        stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}"
        stroke-dashoffset="${(-off).toFixed(2)}"/>`;
      off+=len; return s;
    }).join('');
    return `<svg class="donut" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#221F2B" stroke-width="${thick}"/>
      ${segs}</svg>`;
  },
  legend(items,limit=7){
    const tot=items.reduce((s,i)=>s+i.value,0)||1;
    const top=items.slice(0,limit), rest=items.slice(limit);
    if(rest.length) top.push({label:`+${rest.length} outras`,color:'#52525B',
      value:rest.reduce((s,i)=>s+i.value,0)});
    return `<div class="lg">${top.map(i=>`<div class="lg-i">
      <span class="dot" style="background:${i.color}"></span>
      <span>${esc(i.label)}</span>
      <i>${(i.value/tot*100).toFixed(0)}%</i>
      <b>${money(i.value)}</b></div>`).join('')}</div>`;
  },
  bars(items){
    if(!items.length||items.every(i=>!i.value)) return '<div class="empty">Sem dados</div>';
    const max=Math.max(...items.map(i=>i.value))||1;
    return `<div class="bars">${items.map(i=>`<div class="bcol">
      <div class="bv">${short(i.value)}</div>
      <div class="bb" style="height:${(i.value/max*100).toFixed(1)}%;background:linear-gradient(180deg,${i.color},${i.color}70)"></div>
      <div class="bl">${esc(i.label)}</div></div>`).join('')}</div>`;
  },
  line(pts){
    if(!pts.length) return '<div class="empty">Sem dados</div>';
    const W=620,H=176,P=10,BT=16;
    const max=Math.max(...pts.map(p=>p.value),1);
    const step=pts.length>1?(W-P*2)/(pts.length-1):0;
    const xy=pts.map((p,i)=>[P+i*step, H-BT-(p.value/max)*(H-BT-P-4)]);
    const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=`${d} L ${xy[xy.length-1][0].toFixed(1)} ${H-BT} L ${xy[0][0].toFixed(1)} ${H-BT} Z`;
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:176px" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7C3AED" stop-opacity=".42"/>
        <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></linearGradient></defs>
      ${[0,.5,1].map(f=>`<line x1="${P}" y1="${(P+(H-BT-P)*f).toFixed(1)}" x2="${W-P}" y2="${(P+(H-BT-P)*f).toFixed(1)}" stroke="#221F2B" stroke-width="1"/>`).join('')}
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#0A0A0B" stroke="#A78BFA" stroke-width="2"/>`).join('')}
    </svg>
    <div class="lnx">${pts.map(p=>`<span>${esc(p.label)}</span>`).join('')}</div>`;
  },
  ring(pct,color,size=96,thick=10){
    const r=(size-thick)/2,c=2*Math.PI*r,len=c*Math.min(1,Math.max(0,pct));
    return `<svg class="ring" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#221F2B" stroke-width="${thick}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}"
        stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}"/></svg>`;
  }
};

const UI={
  toast(msg){
    const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
  },
  close(){ $('#modalRoot').innerHTML=''; },
  modal({title,bodyHTML,footHTML='',onMount}){
    $('#modalRoot').innerHTML=`<div class="ov" data-ov>
      <div class="md"><div class="md-h"><h3>${esc(title)}</h3>
      <button class="btn btn-s" data-x>âœ•</button></div>
      <div class="md-b">${bodyHTML}</div>
      ${footHTML?`<div class="md-f">${footHTML}</div>`:''}</div></div>`;
    const ov=$('[data-ov]');
    ov.addEventListener('click',e=>{ if(e.target===ov) UI.close(); });
    $('[data-x]').onclick=UI.close;
    if(onMount) onMount($('.md'));
  },
  form({title,fields,values={},submitLabel='Salvar',onSubmit,extraFoot=''}){
    const rend=f=>{
      const v=values[f.name]!==undefined&&values[f.name]!==null?values[f.name]:(f.def??'');
      if(f.type==='checkbox')
        return `<div class="fld chk"><input type="checkbox" id="f_${f.name}" name="${f.name}" ${v?'checked':''}>
                <label for="f_${f.name}">${esc(f.label)}</label></div>`;
      let input;
      if(f.type==='select')
        input=`<select name="${f.name}" ${f.required?'required':''}>
          ${(f.options||[]).map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
      else if(f.type==='textarea')
        input=`<textarea name="${f.name}" rows="2">${esc(v)}</textarea>`;
      else if(f.type==='money')
        input=`<input name="${f.name}" inputmode="decimal" placeholder="0,00" value="${v===''?'':String(v).replace('.',',')}" ${f.required?'required':''}>`;
      else
        input=`<input type="${f.type||'text'}" name="${f.name}" value="${esc(v)}"
          ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''}
          ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''} ${f.required?'required':''}>`;
      return `<div class="fld"><label>${esc(f.label)}</label>${input}
        ${f.hint?`<div class="hp">${esc(f.hint)}</div>`:''}</div>`;
    };
    let html='',i=0;
    while(i<fields.length){
      const f=fields[i];
      if(f.half&&fields[i+1]&&fields[i+1].half){
        html+=`<div class="row2">${rend(f)}${rend(fields[i+1])}</div>`; i+=2;
      } else { html+=rend(f); i++; }
    }
    UI.modal({
      title,
      bodyHTML:`<form id="gform" style="display:flex;flex-direction:column;gap:15px">${html}</form>`,
      footHTML:`${extraFoot}<button class="btn" data-x2>Cancelar</button>
                <button class="btn btn-p" id="gsub">${esc(submitLabel)}</button>`,
      onMount(){
        $('[data-x2]').onclick=UI.close;
        const submit=()=>{
          const fd=new FormData($('#gform')); const out={};
          fields.forEach(f=>{
            if(f.type==='checkbox') out[f.name]=$(`[name="${f.name}"]`).checked;
            else if(f.type==='money'||f.type==='number') out[f.name]=num(fd.get(f.name));
            else out[f.name]=(fd.get(f.name)||'').toString().trim();
          });
          const miss=fields.find(f=>f.required&&(out[f.name]===''||(out[f.name]===0&&f.type==='money')));
          if(miss){ UI.toast('Falta preencher: '+miss.label); return; }
          onSubmit(out);
        };
        $('#gsub').onclick=submit;
        $('#gform').onsubmit=e=>{e.preventDefault();submit();};
      }
    });
  },
  confirm(msg,onYes,okLabel='Excluir'){
    UI.modal({title:'SÃ³ confirmando',
      bodyHTML:`<p style="color:var(--muted);line-height:1.65;font-size:14px">${esc(msg)}</p>`,
      footHTML:`<button class="btn" data-x3>Voltar</button>

      onMount(){ $('[data-x3]').onclick=UI.close; $('#cy').onclick=()=>{UI.close();onYes();}; }});
  },
  opts(t,{blank='',filter=null}={}){
    let l=DB.all(t); if(filter) l=l.filter(filter);
    const o=l.map(x=>({v:x.id,t:x.nome}));
    if(blank!==false) o.unshift({v:'',t:blank||'â€”'});
    return o;
  }
};

function sheetSafe(v){
  const s=String(v??'');
  return /^[=+@-]/.test(s)?"'"+s:s;
}
function exportCSV(){
  const m=state.month;
  const rows=[['Tipo','Data','Vencimento','Descricao','Pessoa','Categoria','Cartao/Conta','Parcela','Valor','Status']];
  Model.parcelsIn(m).forEach(i=>{
    const p=DB.get('purchases',i.purchaseId),pe=DB.get('people',i.personId),
          c=DB.get('categories',i.categoryId),cd=DB.get('cards',i.cardId);
    rows.push(['Cartao',p?p.dataCompra:'',i.venc,i.descricao||'',pe?pe.nome:'',c?c.nome:'',
      cd?cd.nome:'',`${i.n}/${i.de}`,String(i.valor).replace('.',','),i.paga?'paga':'aberta']);
  });
  DB.all('transactions').filter(t=>(t.data||'').slice(0,7)===m).forEach(t=>{
    const pe=DB.get('people',t.personId),c=DB.get('categories',t.categoryId),a=DB.get('accounts',t.accountId);

  dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),`finctrl-${m}.csv`);
}

/* ---------- migraÃ§Ã£o Ãºnica e compatibilidade ---------- */
(function migrate(){
  const d=DB.raw();
  d.budgets=Array.isArray(d.budgets)?d.budgets:[];
  d.personEvents=Array.isArray(d.personEvents)?d.personEvents:[];
  d.meta=d.meta||{};
  if(Number(d.meta.schema)>=5&&d.meta.engine==='consolidated')return;
  try{localStorage.setItem('finctrl.bak.pre-consolidado',JSON.stringify(d));}catch(e){}

  DB.all('purchases').forEach(p=>{
    if(!p.shareType)p=DB.update('purchases',p.id,{shareType:(DB.get('people',p.personId)||{}).isOwner===false?'other':'owner'})||p;
    if(p.shareType==='other'&&p.sharePct===undefined)DB.update('purchases',p.id,{sharePct:100});
    if(!Array.isArray(p.paid)){
      const n=Math.min(Math.max(0,Number(p.parcelasPagas)||0),Math.max(1,Number(p.numParcelas)||1));
      const paid=Array.from({length:n},(_,i)=>i+1);
      DB.update('purchases',p.id,{paid});
    }
  });
  DB.all('vaultMovements').forEach(m=>{
    if(m.legacy===undefined && m.accountId===undefined)
      DB.update('vaultMovements',m.id,{accountId:'',legacy:true});
  });
  d.meta.schema=5;d.meta.engine='consolidated';d.meta.updatedAt=Date.now();
  DB.replaceAll(d);
})();

/* ---------- modelo financeiro Ãºnico ---------- */
const Model={
  firstComp(p){
    const card=DB.get('cards',p.cardId);
    if(!p.dataCompra)return curYM();
    const [y,m,dd]=String(p.dataCompra).split('-').map(Number);
    const ym=`${y}-${String(m).padStart(2,'0')}`;
    return dd>(Number(card?.diaFechamento)||1)?ymAdd(ym,1):ym;
  },
  parcelsOf(p){
    const n=Math.max(1,Number(p.numParcelas)||1),card=DB.get('cards',p.cardId);
    const tot=Math.round((Number(p.valorTotal)||0)*100),base=Math.floor(tot/n),sobra=tot-base*n;
    const f0=this.firstComp(p);
    const set=Array.isArray(p.paid)?new Set(p.paid.map(Number)):
      new Set(Array.from({length:Math.min(n,Math.max(0,Number(p.parcelasPagas)||0))},(_,i)=>i+1));

/* ---------- fluxo de caixa: caixa real + eventos futuros ---------- */
const addD=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const Cash={
  events(dias=30){
    const h=todayISO(),lim=addD(h,dias),ev=[],seen=new Set();
    const push=(data,val,tipo,desc,sub,extra={})=>{
      if(!data||data<h||data>lim||!Number.isFinite(val)||Math.abs(val)<0.005)return;
      const key=`${tipo}|${data}|${desc}|${r2(val)}|${extra.id||''}`;if(seen.has(key))return;seen.add(key);
      ev.push({data,val:r2(val),tipo,desc,sub,...extra});
    };
    /* pagamentos de fatura jÃ¡ registrados ou ainda abertos */
    const meses=new Set([curYM(),ymAdd(curYM(),1),ymAdd(curYM(),2),ymAdd(curYM(),3),ymAdd(curYM(),4)]);
    meses.forEach(comp=>DB.all('cards').forEach(c=>{
      const inv=Model.invoice(c.id,comp);if(inv.pendente<=0)return;
      push(dateOf(comp,c.diaVencimento),-inv.pendente,'fatura',`Fatura ${c.nome}`,`${inv.itens.filter(i=>!i.paga).length} parcela(s) Â· ${ymLb(comp)}`,{cardId:c.id,comp});
    }));
    /* contas e receitas manuais futuras */
    DB.all('transactions').filter(t=>t.data>h&&t.data<=lim&&t.tipo!=='transferencia'&&t.tipo!=='fatura').forEach(t=>{
      const v=Math.abs(Number(t.valor)||0),sg=(t.tipo==='receita'||t.tipo==='reembolso')?1:-1;
      push(t.data,sg*v,t.tipo,t.descricao||Fin.classe(t.tipo).lb,DB.get('accounts',t.accountId)?.nome||Fin.classe(t.tipo).lb,{id:t.id});
    });
    /* recorrÃªncias ainda pendentes */
    const maxMes=6;
    for(let k=0;k<=maxMes;k++){
      const comp=ymAdd(curYM(),k);
      Recur.month(comp).filter(i=>i.status==='pendente').forEach(i=>{
        if(i.r.cardId){
          const card=DB.get('cards',i.r.cardId);const fake={cardId:i.r.cardId,dataCompra:i.data};
          const f=Model.firstComp(fake),due=dateOf(f,card?.diaVencimento||10);

            i.r.descricao,i.r.tipo==='receita'?'entrada fixa':'conta fixa',{id:i.r.id});
        }else push(i.data,i.r.tipo==='receita'?Math.abs(i.r.valor):-Math.abs(i.r.valor),i.r.tipo,
          i.r.descricao,i.r.tipo==='receita'?'entrada fixa':'conta fixa',{id:i.r.id});

    /* recebimentos futuros de pessoas */
    DB.all('settlements').filter(s=>s.data>h&&s.data<=lim).forEach(s=>push(s.data,Math.abs(Number(s.valor)||0),'reembolso','Pagamento recebido',
      DB.get('people',s.personId)?.nome||'Pessoa',{id:s.id}));

    DB.all('vaultMovements').filter(m=>!Model.isLegacyVault(m)&&m.data>h&&m.data<=lim).forEach(m=>
      push(m.data,-(Number(m.valor)||0),m.valor>=0?'aporte':'resgate',DB.get('vaults',m.vaultId)?.nome||'Cofrinho',m.valor>=0?'aporte':'resgate',{id:m.id}));

  project(dias=30){

Fin.poupanca=function(comp){
  const mov=DB.all('vaultMovements').filter(m=>(m.data||'').slice(0,7)===comp);
  const aportes=r2(mov.filter(m=>m.valor>0).reduce((s,m)=>s+Number(m.valor),0));
  const resgates=r2(mov.filter(m=>m.valor<0).reduce((s,m)=>s-Math.min(0,Number(m.valor)),0));
  const receita=Model.monthIncome(comp),liq=r2(aportes-resgates);

Fin.dre=function(comp){
  const tx=DB.all('transactions').filter(t=>(t.data||'').slice(0,7)===comp);
  const receita=r2(tx.filter(t=>Fin.contaRenda(t.tipo)).reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
  const despConta=r2(tx.filter(t=>Fin.contaGasto(t.tipo)).reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
  const despCartao=r2(Model.parcelsIn(comp).reduce((s,i)=>s+i.valor,0));
  const gasto=r2(despConta+despCartao),mov=DB.all('vaultMovements').filter(m=>(m.data||'').slice(0,7)===comp);
  const aportes=r2(mov.filter(m=>m.valor>0).reduce((s,m)=>s+Math.abs(Number(m.valor)||0),0));
  const resgates=r2(mov.filter(m=>m.valor<0).reduce((s,m)=>s+Math.abs(Number(m.valor)||0),0));
  const reservaLiq=r2(aportes-resgates),fatPago=r2(tx.filter(t=>t.tipo==='fatura').reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
  const transf=r2(tx.filter(t=>t.tipo==='transferencia').reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));

  const resultado=r2(receita-gasto);
  return {comp,receita,gasto,despConta,despCartao,resultado,aportes,resgates,reservaLiq,fatPago,transf,reembolso,
    taxaPoupanca:receita>0?r2(reservaLiq/receita*100):0,taxaSobra:receita>0?r2(resultado/receita*100):0,
    sobraNaoReservada:r2(resultado-reservaLiq)};
};

function validarBackup(o){
  const tabs=['people','accounts','cards','categories','transactions','purchases','vaults','vaultMovements','settlements','recurrences','budgets','personEvents'];
  const err=[],warn=[];
  if(!o||typeof o!=='object')return {ok:false,err:['Arquivo nÃ£o Ã© um objeto vÃ¡lido'],warn:[],cont:[],schema:'?'};
  tabs.forEach(t=>{if(o[t]!==undefined&&!Array.isArray(o[t]))err.push(`${t} nÃ£o Ã© uma lista`);});
  const ids=new Set();
  tabs.forEach(t=>(o[t]||[]).forEach((r,i)=>{if(r.id&&ids.has(r.id))err.push(`ID duplicado em ${t}[${i}]`);if(r.id)ids.add(r.id);if(r.valor!==undefined&&!Number.isFinite(Number(r.valor)))err.push(`${t}[${i}] com valor invÃ¡lido`);if(r.data&&!/^\d{4}-\d{2}-\d{2}$/.test(r.data))warn.push(`${t}[${i}] com data fora do padrÃ£o`);}));
  const has=(t,id)=>!id||!!(o[t]||[]).some(x=>x.id===id);
  (o.purchases||[]).forEach((p,i)=>{if(!has('cards',p.cardId))err.push(`purchases[${i}] sem cartÃ£o vÃ¡lido`);if(p.personId&&!has('people',p.personId))err.push(`purchases[${i}] sem pessoa vÃ¡lida`);if(!Number.isFinite(Number(p.valorTotal))||Number(p.valorTotal)<0)err.push(`purchases[${i}] com valor total invÃ¡lido`);});
  (o.transactions||[]).forEach((t,i)=>{if(t.accountId&&!has('accounts',t.accountId))err.push(`transactions[${i}] sem conta vÃ¡lida`);if(t.toAccountId&&!has('accounts',t.toAccountId))err.push(`transactions[${i}] sem destino vÃ¡lido`);});
  (o.settlements||[]).forEach((s,i)=>{if(!has('people',s.personId))err.push(`settlements[${i}] sem pessoa vÃ¡lida`);});
  (o.vaultMovements||[]).forEach((v,i)=>{if(!has('vaults',v.vaultId))err.push(`vaultMovements[${i}] sem cofrinho vÃ¡lido`);if(v.accountId&&!has('accounts',v.accountId))err.push(`vaultMovements[${i}] sem conta vÃ¡lida`);});
  (o.budgets||[]).forEach((b,i)=>{if(!has('categories',b.categoryId))err.push(`budgets[${i}] sem categoria vÃ¡lida`);if(Number(b.valor)<0)err.push(`budgets[${i}] com limite negativo`);});
  return {ok:err.length===0,err:[...new Set(err)],warn:[...new Set(warn)],cont:tabs.map(t=>({t,n:(o[t]||[]).length})).filter(x=>x.n),schema:o.meta?.schema||'desconhecida'};
}
