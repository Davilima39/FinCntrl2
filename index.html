<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FinCtrl — Controle Financeiro</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0B;--surface:#141318;--elev:#1C1B22;--line:#272530;
  --primary:#6D28D9;--primary2:#7C3AED;--danger:#DC2626;--ok:#10B981;
  --warn:#F59E0B;--text:#FAFAFA;--muted:#A1A1AA;--muted2:#6B6875;
  --soft:#F87171;--crit:#DC2626;--gold:#FBBF24;--r:14px;--sb:248px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -8%,rgba(109,40,217,.18),transparent 60%),
    radial-gradient(700px 400px at 105% 8%,rgba(220,38,38,.10),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit;font-size:16px}
button{cursor:pointer;background:none;border:0}
a{color:var(--primary2);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2E2B38;border-radius:9px}

#app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:var(--sb);flex:0 0 var(--sb);background:rgba(20,19,24,.86);
  backdrop-filter:blur(12px);border-right:1px solid var(--line);
  padding:22px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.brand-ico{width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(140deg,var(--primary2),var(--danger));
  display:grid;place-items:center;font-weight:800;font-size:17px;
  box-shadow:0 6px 18px rgba(109,40,217,.42)}
.brand b{font-size:17px;letter-spacing:-.3px;display:block}
.brand small{color:var(--muted2);font-size:11px;letter-spacing:.11em;text-transform:uppercase}
.nav-i{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  color:var(--muted);font-weight:500;width:100%;text-align:left;transition:.16s;position:relative}
.nav-i:hover{background:var(--elev);color:var(--text)}
.nav-i.on{background:linear-gradient(90deg,rgba(109,40,217,.28),rgba(109,40,217,.05));color:#fff}
.nav-i.on::before{content:"";position:absolute;left:0;width:3px;height:22px;border-radius:3px;background:var(--primary2)}
.nav-i i{width:20px;text-align:center;font-style:normal;font-size:16px;opacity:.95}
.nav-i .bdg{margin-left:auto;background:var(--warn);color:#291a00;font-size:10.5px;font-weight:800;
  padding:1px 7px;border-radius:999px}
.sp{flex:1}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:15px 24px;background:rgba(10,10,11,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.top h1{font-size:19px;letter-spacing:-.4px;font-weight:700}
.top .sub{color:var(--muted2);font-size:12px}
.wrap{padding:20px 24px 120px;max-width:1280px;width:100%}

/* ===== NAVEGAÇÃO DE MESES ===== */
.mpick{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:11px;
  background:var(--elev);border:1px solid var(--line);font-weight:700;font-size:14.5px;
  min-height:40px;text-transform:capitalize}
.mpick:hover{background:#2A2734;border-color:var(--primary)}
.mpick i{font-style:normal;font-size:10px;color:var(--muted2)}
.mpick .rel{font-weight:500;font-size:12px;color:var(--muted2);margin-left:2px;text-transform:none}
.marr{width:36px;height:36px;border-radius:10px;background:var(--elev);
  border:1px solid var(--line);color:var(--muted);font-size:17px;flex:0 0 36px}
.marr:hover{background:#2A2734;color:#fff}
.mstrip{display:flex;gap:6px;overflow-x:auto;padding:11px 24px 12px;
  scroll-behavior:smooth;scrollbar-width:none;border-bottom:1px solid var(--line);
  background:rgba(10,10,11,.85);backdrop-filter:blur(14px);position:sticky;top:0;z-index:19}
.mstrip::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;min-width:56px;padding:8px 11px;border-radius:11px;
  background:transparent;border:1px solid transparent;color:var(--muted2);
  font-size:12.5px;font-weight:650;text-transform:capitalize;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;justify-content:center}
.mchip:hover{background:var(--elev);color:var(--text)}
.mchip i{font-style:normal;font-size:9.5px;opacity:.6;font-weight:700}
.mchip u{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;
  background:var(--primary2);text-decoration:none}
.mchip.cur{color:var(--primary2)}
.mchip.cur::before{content:"";position:absolute;top:4px;right:6px;width:5px;height:5px;
  border-radius:50%;background:var(--ok)}
.mchip.on{background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(109,40,217,.4)}
.mchip.on u{background:#fff}
.mchip.on i{opacity:.85}
.ypick{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px}
.ypick b{font-size:19px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mcell{padding:15px 8px;border-radius:12px;background:var(--elev);border:1px solid var(--line);
  font-size:13.5px;font-weight:650;text-transform:capitalize;position:relative;min-height:52px}
.mcell:hover{background:#2A2734;border-color:var(--primary)}
.mcell u{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--primary2);text-decoration:none}
.mcell.cur{border-color:var(--ok);color:#6EE7B7}
.mcell.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}
.mcell.on u{background:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.55fr 1fr}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px;gap:10px;flex-wrap:wrap}
.sec h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
.sec .hint{color:var(--muted2);font-size:12px}

.kpi{position:relative;overflow:hidden}
.kpi .lb{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .vl{font-size:25px;font-weight:750;letter-spacing:-.8px;margin-top:9px;font-variant-numeric:tabular-nums}
.kpi .ft{color:var(--muted2);font-size:12px;margin-top:5px}
.kpi::after{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--bar,var(--primary))}
.pos{color:var(--ok)}.neg{color:var(--soft)}.crit{color:var(--crit)}.pri{color:var(--primary2)}.wrn{color:var(--warn)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
  background:var(--elev);border:1px solid var(--line);font-weight:600;font-size:14px;transition:.16s}
.btn:hover{background:#2A2734;border-color:#39354a}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;
  color:#fff;box-shadow:0 4px 14px rgba(109,40,217,.34)}
.btn-p:hover{filter:brightness(1.12)}
.btn-d{background:rgba(220,38,38,.13);border-color:rgba(220,38,38,.4);color:#FCA5A5}
.btn-d:hover{background:rgba(220,38,38,.22)}
.btn-s{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-g{background:var(--ok);border-color:transparent;color:#03231a}

.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--elev);border:1px solid var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted2);font-weight:700;background:var(--elev);white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr:hover{background:rgba(109,40,217,.055)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar-t{height:7px;border-radius:7px;background:#25222E;overflow:hidden}
.bar-f{height:100%;border-radius:7px;transition:width .5s}
.empty{padding:40px 20px;text-align:center;color:var(--muted2);font-size:13.5px}
.empty b{display:block;color:var(--muted);font-size:15px;margin-bottom:5px}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:172px;height:172px;flex:0 0 172px;transform:rotate(-90deg)}
.lg{flex:1;min-width:190px;display:flex;flex-direction:column;gap:9px}
.lg-i{display:flex;align-items:center;gap:9px;font-size:13px}
.lg-i span:nth-child(2){flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-i b{font-variant-numeric:tabular-nums}
.lg-i i{font-style:normal;color:var(--muted2);font-size:11.5px;width:38px;text-align:right}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:20px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:6px;height:100%;min-width:0}
.bcol .bv{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bcol .bb{width:100%;max-width:52px;border-radius:7px 7px 0 0;min-height:3px;transition:height .5s}
.bcol .bl{font-size:11px;color:var(--muted2);text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;width:100%}
.lnx{display:flex;margin-top:7px}
.lnx span{flex:1;text-align:center;font-size:10.5px;color:var(--muted2)}
.ring{width:96px;height:96px;transform:rotate(-90deg)}

.ov{position:fixed;inset:0;background:rgba(5,5,7,.76);backdrop-filter:blur(5px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.md{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;
  max-width:520px;box-shadow:0 26px 70px rgba(0,0,0,.66);animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.md-h{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between}
.md-h h3{font-size:17px;letter-spacing:-.3px}
.md-b{padding:22px;display:flex;flex-direction:column;gap:15px;max-height:66vh;overflow-y:auto}
.md-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:7px}
.fld label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;width:100%;transition:.16s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--primary2);
  box-shadow:0 0 0 3px rgba(109,40,217,.2)}
.fld .hp{font-size:11.5px;color:var(--muted2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.chk{flex-direction:row;align-items:center;gap:10px}
.chk input{width:19px;height:19px;accent-color:var(--primary2)}
.chk label{text-transform:none;letter-spacing:0;font-size:14px;color:var(--text)}

.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 10px 28px rgba(109,40,217,.5);font-size:26px;color:#fff;display:grid;place-items:center}
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:200;
  background:var(--elev);border:1px solid var(--line);padding:12px 18px;border-radius:12px;
  font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s}
.seg{display:flex;gap:5px;background:var(--elev);border:1px solid var(--line);
  padding:4px;border-radius:11px;overflow-x:auto}
.seg button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--primary);color:#fff}
.flt{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.flt select,.flt input{background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;font-size:13.5px}

.hero{background:linear-gradient(135deg,rgba(109,40,217,.22),rgba(20,19,24,.6) 55%,rgba(220,38,38,.10));
  border:1px solid var(--line);border-radius:20px;padding:26px 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.30),transparent 70%)}
.hero .hl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;display:flex;align-items:center;gap:8px;position:relative}
.hero .hv{font-size:44px;font-weight:800;letter-spacing:-1.8px;margin:10px 0 4px;
  font-variant-numeric:tabular-nums;line-height:1;position:relative}
.hero .hs{color:var(--muted);font-size:13.5px;position:relative}
.hero .hb{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap;position:relative}
.hero .hb div{min-width:108px}
.hero .hb .k{color:var(--muted2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hero .hb .v{font-size:16.5px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums}

.ins{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);margin-bottom:9px}
.ins .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.ins p{font-size:13.5px;line-height:1.55;color:var(--text)}
.ins p b{font-weight:750}
.ins small{display:block;color:var(--muted2);font-size:12px;margin-top:2px}

.due{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
  background:var(--elev);margin-bottom:8px;flex-wrap:wrap}
.due .d{width:44px;flex:0 0 44px;text-align:center;border-radius:99px;padding:5px 0;background:var(--bg)}
.due .d b{display:block;font-size:16px;font-weight:800;line-height:1}
.due .d span{font-size:9.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em}
.due.urg{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.34)}

.zs{padding:34px 22px;text-align:center}
.zs .em{font-size:40px;margin-bottom:12px;display:block}
.zs h4{font-size:16.5px;margin-bottom:7px}
.zs p{color:var(--muted);font-size:13.5px;line-height:1.65;max-width:430px;margin:0 auto 18px}
.zs .steps{max-width:400px;margin:0 auto 18px;text-align:left;display:flex;flex-direction:column;gap:9px}
.zs .st{display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--muted)}
.zs .st i{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--primary);
  color:#fff;font-style:normal;font-size:11.5px;font-weight:800;display:grid;place-items:center}

.mbar{display:flex;align-items:center;gap:11px;margin-top:15px;position:relative}
.mbar .t{flex:1;height:8px;border-radius:8px;background:#25222E;overflow:hidden;display:flex}
.mbar .t i{height:100%;display:block}
.mbar span{font-size:11.5px;color:var(--muted2);white-space:nowrap}
.eye{padding:7px 10px;border-radius:9px;background:var(--elev);border:1px solid var(--line);font-size:15px}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.goal-hit{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.alert{border-color:rgba(245,158,11,.4);background:linear-gradient(90deg,rgba(245,158,11,.09),transparent)}

@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g3{grid-template-columns:1fr}}
@media(max-width:760px){
  .sidebar{display:none}
  .wrap{padding:16px 14px 130px}
  .top{padding:12px 14px;gap:8px}
  .top h1{font-size:17px}
  .mstrip{padding:9px 14px 10px}
  .mpick{font-size:13.5px;padding:6px 11px}
  .mpick .rel{display:none}
  .marr{display:none}
  .g4,.g2,.g3{grid-template-columns:1fr}
  .kpi .vl{font-size:22px}
  .hero{padding:20px 17px}
  .hero .hv{font-size:34px}
  .hero .hb{gap:14px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(20,19,24,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--muted2);font-size:9.5px;font-weight:600;border-radius:10px;position:relative}
  .tabbar button i{font-style:normal;font-size:19px}
  .tabbar button.on{color:var(--primary2)}
  .tabbar .bdg{position:absolute;top:2px;right:18%;background:var(--warn);color:#291a00;
    font-size:9px;font-weight:800;padding:0 5px;border-radius:999px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));width:52px;height:52px}
  .ov{align-items:flex-end;padding:0}
  .md{border-radius:22px 22px 0 0;max-height:93vh;max-width:100%;
    animation:sheet .27s cubic-bezier(.32,.72,0,1)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .md-h{position:relative;padding-top:24px}
  .md-h::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:4px;background:#3A3645}
  .md-b{max-height:62vh}
  .md-f{position:sticky;bottom:0;background:var(--surface);
    padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .md-f .btn{flex:1;justify-content:center}
  .btn{min-height:44px}
  .row2{grid-template-columns:1fr}
  th,td{padding:10px 12px;font-size:13px}
  .donut{width:142px;height:142px;flex:0 0 142px}
}

/* ==================================================================
   2) RECUR & SMART INTEGRADOS
   ================================================================== */
const Recur={
  FREQ:{mensal:1,bimestral:2,trimestral:3,semestral:6,anual:12},
  FREQL:{mensal:'Mensal',bimestral:'Bimestral',trimestral:'Trimestral',
         semestral:'Semestral',anual:'Anual'},

  hits(r,comp){
    if(!r||r.ativo===false) return false;
    const ini=(r.inicio||'').slice(0,7);
    if(!ini||ymDiff(comp,ini)<0) return false;
    const fim=(r.fim||'').slice(0,7);
    if(fim&&ymDiff(comp,fim)>0) return false;
    const step=Recur.FREQ[r.frequencia||'mensal']||1;
    return ymDiff(comp,ini)%step===0;
  },
  posted(r,comp){
    return DB.all('transactions').find(t=>t.recurrenceId===r.id&&t.comp===comp)
        || DB.all('purchases').find(p=>p.recurrenceId===r.id&&p.comp===comp) || null;
  },
  skipped(r,comp){ return (r.skips||[]).includes(comp); },
  skip(id,comp,on){
    const r=DB.get('recurrences',id); if(!r) return;
    const s=new Set(r.skips||[]);
    on?s.add(comp):s.delete(comp);
    DB.update('recurrences',id,{skips:Array.from(s)});
  },
  month(comp){
    return DB.all('recurrences').filter(r=>Recur.hits(r,comp)).map(r=>{
      const tx=Recur.posted(r,comp);
      return {r,comp,tx,
        status: tx?'lancado':(Recur.skipped(r,comp)?'pulado':'pendente'),
        data: dateOf(comp,Number(r.diaVencimento)||1)};
    }).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  },
  pending(comp){ return Recur.month(comp).filter(i=>i.status==='pendente'); },
  previsto(comp){
    const p=Recur.pending(comp);
    const sum=t=>r2(p.filter(i=>i.r.tipo===t).reduce((s,i)=>s+(Number(i.r.valor)||0),0));
    return {saida:sum('despesa'),entrada:sum('receita'),n:p.length};
  },
  post(r,comp,valor){
    if(!r||Recur.posted(r,comp)) return null;
    const v=valor!==undefined?valor:(Number(r.valor)||0);
    const data=dateOf(comp,Number(r.diaVencimento)||1);
    if(r.cardId) return DB.insert('purchases',{cardId:r.cardId,personId:r.personId,
      categoryId:r.categoryId,descricao:r.descricao,valorTotal:v,dataCompra:data,
      numParcelas:1,parcelasPagas:0,paid:[],recurrenceId:r.id,comp});
    return DB.insert('transactions',{tipo:r.tipo,data,descricao:r.descricao,valor:v,
      accountId:r.accountId,categoryId:r.categoryId,personId:r.personId,
      recurrenceId:r.id,comp,observacao:r.observacao});
  },
  unpost(r,comp){
    const t=DB.all('transactions').find(x=>x.recurrenceId===r.id&&x.comp===comp);
    if(t){ DB.remove('transactions',t.id); return; }
    const p=DB.all('purchases').find(x=>x.recurrenceId===r.id&&x.comp===comp);
    if(p) DB.remove('purchases',p.id);
  },
  postAll(comp){
    const p=Recur.pending(comp);
    p.forEach(i=>Recur.post(i.r,comp));
    return p.length;
  },
  autoRun(){
    const now=curYM(); let n=0;
    DB.all('recurrences').filter(r=>r.auto&&r.ativo!==false).forEach(r=>{
      let comp=(r.inicio||'').slice(0,7), k=0;
      if(!comp) return;
      while(ymDiff(now,comp)>=0&&k<120){
        if(Recur.hits(r,comp)&&!Recur.skipped(r,comp)&&!Recur.posted(r,comp)){
          Recur.post(r,comp); n++;
        }
        comp=ymAdd(comp,1); k++;
      }
    });
    return n;
  },
  origem(r){
    const c=r.cardId?DB.get('cards',r.cardId):null;
    const a=r.accountId?DB.get('accounts',r.accountId):null;
    return c?{nome:c.nome,cor:c.cor||'#6D28D9',tipo:'cartão'}
          :a?{nome:a.nome,cor:a.cor||'#8B5CF6',tipo:'conta'}:null;
  }
};

const Smart={
  safe(comp){
    const snap=Fin.snapshot(comp);
    return {
      saldo:snap.contas,
      faturas:snap.faturas,
      fixas:snap.fixas,
      livre:snap.disponivel??(snap.contas-snap.comprometido)
    };
  },
  diasAte(iso){
    const a=new Date(todayISO()+'T00:00'),b=new Date(iso+'T00:00');
    return Math.round((b-a)/864e5);
  },
  due(dias=10){
    const hoje=todayISO(),lim=addD(hoje,dias),out=[];
    DB.all('cards').filter(c=>!c.archived).forEach(c=>{
      for(let k=0;k<=3;k++){
        const comp=ymAdd(curYM(),k),inv=Model.invoice(c.id,comp);
        if(inv.pendente<=0)continue;
        const data=dateOf(comp,c.diaVencimento);
        if(data>=hoje&&data<=lim)out.push({data,titulo:`Fatura ${c.nome}`,sub:`${inv.itens.filter(i=>!i.paga).length} parcela(s) · ${ymLb(comp)}`,valor:inv.pendente,cardId:c.id,comp});
      }
    });
    for(let k=0;k<=3;k++){
      const comp=ymAdd(curYM(),k);
      Recur.month(comp).filter(i=>i.status==='pendente'&&i.data>=hoje&&i.data<=lim).forEach(i=>out.push({data:i.data,titulo:i.r.descricao,sub:i.r.tipo==='receita'?'entrada fixa':'conta fixa',valor:Math.abs(Number(i.r.valor)||0),rec:i.r.id,comp}));
    }
    return out.sort((a,b)=>a.data.localeCompare(b.data));
  },
  insights(comp){
    const ins=[];
    const dre=Fin.dre(comp);
    if(dre.receita>0&&dre.gasto>dre.receita){
      ins.push({ic:'⚠️',bg:'rgba(220,38,38,.2)',html:`<b>Você gastou mais do que recebeu em ${ymLb(comp)}</b>. O déficit do mês é de <span class="crit">${money(dre.gasto-dre.receita)}</span>.`,sub:'Considere rever despesas supérfluas no próximo mês.'});
    }
    const dev=Cash.aReceber();
    if(dev>0){
      ins.push({ic:'👥',bg:'rgba(245,158,11,.2)',html:`Você tem <b>${money(dev)} a receber</b> de familiares ou terceiros.`,sub:'Acompanhe os detalhes na aba Pessoas.'});
    }
    return ins;
  }
};

/* ==================================================================
   3) CHART — SVG puro
   ================================================================== */
const Chart={
  donut(items,size=172,thick=23){
    const tot=items.reduce((s,i)=>s+i.value,0);
    if(!tot) return '<div class="empty">Sem dados neste mês</div>';
    const r=(size-thick)/2, c=2*Math.PI*r; let off=0;
    const segs=items.map(i=>{
      const len=c*(i.value/tot);
      const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${i.color}"
        stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}"
        stroke-dashoffset="${(-off).toFixed(2)}"/>`;
      off+=len; return s;
    }).join('');
    return `<svg class="donut" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#221F2B" stroke-width="${thick}"/>
      ${segs}</svg>`;
  },
  legend(items,limit=7){
    const tot=items.reduce((s,i)=>s+i.value,0)||1;
    const top=items.slice(0,limit), rest=items.slice(limit);
    if(rest.length) top.push({label:`+${rest.length} outras`,color:'#52525B',
      value:rest.reduce((s,i)=>s+i.value,0)});
    return `<div class="lg">${top.map(i=>`<div class="lg-i">
      <span class="dot" style="background:${i.color}"></span>
      <span>${esc(i.label)}</span>
      <i>${(i.value/tot*100).toFixed(0)}%</i>
      <b>${money(i.value)}</b></div>`).join('')}</div>`;
  },
  bars(items){
    if(!items.length||items.every(i=>!i.value)) return '<div class="empty">Sem dados</div>';
    const max=Math.max(...items.map(i=>i.value))||1;
    return `<div class="bars">${items.map(i=>`<div class="bcol">
      <div class="bv">${short(i.value)}</div>
      <div class="bb" style="height:${(i.value/max*100).toFixed(1)}%;background:linear-gradient(180deg,${i.color},${i.color}70)"></div>
      <div class="bl">${esc(i.label)}</div></div>`).join('')}</div>`;
  },
  line(pts){
    if(!pts.length) return '<div class="empty">Sem dados</div>';
    const W=620,H=176,P=10,BT=16;
    const max=Math.max(...pts.map(p=>p.value),1);
    const step=pts.length>1?(W-P*2)/(pts.length-1):0;
    const xy=pts.map((p,i)=>[P+i*step, H-BT-(p.value/max)*(H-BT-P-4)]);
    const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=`${d} L ${xy[xy.length-1][0].toFixed(1)} ${H-BT} L ${xy[0][0].toFixed(1)} ${H-BT} Z`;
    const gid='g'+Math.random().toString(36).slice(2,7);
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:176px" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7C3AED" stop-opacity=".42"/>
        <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></linearGradient></defs>
      ${[0,.5,1].map(f=>`<line x1="${P}" y1="${(P+(H-BT-P)*f).toFixed(1)}" x2="${W-P}" y2="${(P+(H-BT-P)*f).toFixed(1)}" stroke="#221F2B" stroke-width="1"/>`).join('')}
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${d}" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#0A0A0B" stroke="#A78BFA" stroke-width="2"/>`).join('')}
    </svg>
    <div class="lnx">${pts.map(p=>`<span>${esc(p.label)}</span>`).join('')}</div>`;
  },
  ring(pct,color,size=96,thick=10){
    const r=(size-thick)/2,c=2*Math.PI*r,len=c*Math.min(1,Math.max(0,pct));
    return `<svg class="ring" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#221F2B" stroke-width="${thick}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${thick}"
        stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}"/></svg>`;
  }
};

const UI={
  toast(msg){
    const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
  },
  close(){ $('#modalRoot').innerHTML=''; },
  modal({title,bodyHTML,footHTML='',onMount}){
    $('#modalRoot').innerHTML=`<div class="ov" data-ov>
      <div class="md"><div class="md-h"><h3>${esc(title)}</h3>
      <button class="btn btn-s" data-x>✕</button></div>
      <div class="md-b">${bodyHTML}</div>
      ${footHTML?`<div class="md-f">${footHTML}</div>`:''}</div></div>`;
    const ov=$('[data-ov]');
    ov.addEventListener('click',e=>{ if(e.target===ov) UI.close(); });
    $('[data-x]').onclick=UI.close;
    if(onMount) onMount($('.md'));
  },
  form({title,fields,values={},submitLabel='Salvar',onSubmit,extraFoot=''}){
    const rend=f=>{
      const v=values[f.name]!==undefined&&values[f.name]!==null?values[f.name]:(f.def??'');
      if(f.type==='checkbox')
        return `<div class="fld chk"><input type="checkbox" id="f_${f.name}" name="${f.name}" ${v?'checked':''}>
                <label for="f_${f.name}">${esc(f.label)}</label></div>`;
      let input;
      if(f.type==='select')
        input=`<select name="${f.name}" ${f.required?'required':''}>
          ${(f.options||[]).map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(v)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;
      else if(f.type==='textarea')
        input=`<textarea name="${f.name}" rows="2">${esc(v)}</textarea>`;
      else if(f.type==='money')
        input=`<input name="${f.name}" inputmode="decimal" placeholder="0,00" value="${v===''?'':String(v).replace('.',',')}" ${f.required?'required':''}>`;
      else
        input=`<input type="${f.type||'text'}" name="${f.name}" value="${esc(v)}"
          ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''}
          ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''} ${f.required?'required':''}>`;
      return `<div class="fld"><label>${esc(f.label)}</label>${input}
        ${f.hint?`<div class="hp">${esc(f.hint)}</div>`:''}</div>`;
    };
    let html='',i=0;
    while(i<fields.length){
      const f=fields[i];
      if(f.half&&fields[i+1]&&fields[i+1].half){
        html+=`<div class="row2">${rend(f)}${rend(fields[i+1])}</div>`; i+=2;
      } else { html+=rend(f); i++; }
    }
    UI.modal({
      title,
      bodyHTML:`<form id="gform" style="display:flex;flex-direction:column;gap:15px">${html}</form>`,
      footHTML:`${extraFoot}<button class="btn" data-x2>Cancelar</button>
                <button class="btn btn-p" id="gsub">${esc(submitLabel)}</button>`,
      onMount(){
        $('[data-x2]').onclick=UI.close;
        const submit=()=>{
          const fd=new FormData($('#gform')); const out={};
          fields.forEach(f=>{
            if(f.type==='checkbox') out[f.name]=$(`[name="${f.name}"]`).checked;
            else if(f.type==='money'||f.type==='number') out[f.name]=num(fd.get(f.name));
            else out[f.name]=(fd.get(f.name)||'').toString().trim();
          });
          const miss=fields.find(f=>f.required&&(out[f.name]===''||(out[f.name]===0&&f.type==='money')));
          if(miss){ UI.toast('Falta preencher: '+miss.label); return; }
          onSubmit(out);
        };
        $('#gsub').onclick=submit;
        $('#gform').onsubmit=e=>{e.preventDefault();submit();};
      }
    });
  },
  confirm(msg,onYes,okLabel='Excluir'){
    UI.modal({title:'Só confirmando',
      bodyHTML:`<p style="color:var(--muted);line-height:1.65;font-size:14px">${esc(msg)}</p>`,
      footHTML:`<button class="btn" data-x3>Voltar</button>
                <button class="btn btn-d" id="cy">${esc(okLabel)}</button>`,
      onMount(){ $('[data-x3]').onclick=UI.close; $('#cy').onclick=()=>{UI.close();onYes();}; }});
  },
  opts(t,{blank='',filter=null}={}){
    let l=DB.all(t); if(filter) l=l.filter(filter);
    const o=l.map(x=>({v:x.id,t:x.nome}));
    if(blank!==false) o.unshift({v:'',t:blank||'—'});
    return o;
  }
};

          ${inv.paga&&inv.total>0?'<span class="tag" style="color:#6EE7B7;border-color:#10B98155">paga ✓</span>':''}</div>

        <div style="color:var(--muted2);font-size:12px;margin:5px 0 13px">vence ${dmyF(dateOf(m,c.diaVencimento))}</div>
        <div class="bar-t"><div class="bar-f" style="width:${pc}%;background:${pc>85?'var(--crit)':c.cor||'#6D28D9'}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted2);margin-top:6px">
          <span>${pc.toFixed(0)}% do limite</span><span>livre ${money(Math.max(0,lim-used))}</span></div>
      </div>`;}).join('')}</div>`
    :`<div class="card"><div class="zs"><span class="em">💳</span><h4>Nenhum cartão ainda</h4>
      <p>Cadastre seus cartões para acompanhar faturas, limites e quanto cada familiar gastou.</p>
      <button class="btn btn-p" data-act="card-new">+ Cadastrar cartão</button></div></div>`}

  ${vaults.length?`<div class="sec"><h2>Cofrinhos</h2><b class="pos">${money(Model.vaultTotal())}</b></div>
  <div class="grid g3">${vaults.map(v=>{
    const b=Model.vaultBalance(v.id),mt=Number(v.metaValor)||0,pc=mt?b/mt:0;
    return `<div class="card ${pc>=1?'goal-hit':''}" style="display:flex;align-items:center;gap:15px">
      <div style="position:relative;flex:0 0 96px;height:96px">
        ${Chart.ring(pc,pc>=1?'#FBBF24':(v.cor||'#10B981'))}
        <div style="position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:750">
          ${pc>=1?'🎉':mt?Math.round(pc*100)+'%':'—'}</div></div>
      <div style="min-width:0">
        <div style="font-size:13.5px;font-weight:650">${esc(v.icone||'')} ${esc(v.nome)}</div>
        <div style="font-size:18px;font-weight:750;margin-top:3px">${money(b)}</div>
        <div style="color:var(--muted2);font-size:11.5px">${mt?'de '+money(mt):'sem meta'}</div>
      </div></div>`;}).join('')}</div>`
    :`<div class="sec"><h2>Cofrinhos</h2></div>
      <div class="card"><div class="zs"><span class="em">🐷</span><h4>Comece a guardar</h4>
      <p>Crie um cofrinho com meta — o app calcula em quantos meses você chega lá.</p>
      <button class="btn btn-p" data-act="vt-new">+ Criar cofrinho</button></div></div>`}`;
};

/* ---------------- Lançamentos ---------------- */
V.lanc=()=>{
  const m=state.month;
  const f=state.tab.lanc||(state.tab.lanc={person:'',card:'',cat:'',acc:'',q:''});
  const prv=Recur.previsto(m);
  let rows=[];
  Model.parcelsIn(m).forEach(i=>{
    const p=DB.get('purchases',i.purchaseId);
    rows.push({tipo:'cartao',data:p?p.dataCompra:'',desc:i.descricao,valor:i.valor,
      personId:i.personId,catId:i.categoryId,cardId:i.cardId,accId:'',
      badge:i.de>1?`${i.n}/${i.de}`:'1x',ref:i.purchaseId});
  });
  DB.all('transactions').filter(t=>(t.data||'').slice(0,7)===m&&t.tipo!=='fatura').forEach(t=>{
    rows.push({tipo:t.tipo,data:t.data,desc:t.descricao,valor:Number(t.valor)||0,
      personId:t.personId,catId:t.categoryId,cardId:'',accId:t.accountId,
      badge:t.tipo==='receita'?'receita':t.tipo==='transferencia'?'transf.':'conta',
      ref:t.id,isTx:true});
  });
  rows=rows.filter(r=>(!f.person||r.personId===f.person)&&(!f.card||r.cardId===f.card)&&
    (!f.cat||r.catId===f.cat)&&(!f.acc||r.accId===f.acc)&&
    (!f.q||(r.desc||'').toLowerCase().includes(f.q.toLowerCase())))
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const tot=r2(rows.filter(r=>r.tipo!=='receita'&&r.tipo!=='transferencia').reduce((s,r)=>s+r.valor,0));
  const rec=r2(rows.filter(r=>r.tipo==='receita').reduce((s,r)=>s+r.valor,0));

  return `
  ${prv.n?`<div class="card alert" style="margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <b style="flex:1;min-width:180px;font-size:14px">⏳ ${prv.n} recorrente(s) pendente(s) em ${ymLb(m)}</b>
    <button class="btn btn-s" data-act="go" data-r="rec">Ver agenda</button>
    <button class="btn btn-s btn-p" data-act="rc-all">✓ Lançar todas</button></div>`:''}
  <div class="flt" style="margin-bottom:16px">
    <input placeholder="Buscar descrição…" value="${esc(f.q)}" data-f="q" style="flex:1;min-width:150px">
    <select data-f="person">${[{v:'',t:'Todas as pessoas'}].concat(UI.opts('people',{blank:false})).map(o=>`<option value="${o.v}" ${o.v===f.person?'selected':''}>${esc(o.t)}</option>`).join('')}</select>
    <select data-f="card">${[{v:'',t:'Todos os cartões'}].concat(UI.opts('cards',{blank:false})).map(o=>`<option value="${o.v}" ${o.v===f.card?'selected':''}>${esc(o.t)}</option>`).join('')}</select>
    <select data-f="cat">${[{v:'',t:'Todas as categorias'}].concat(UI.opts('categories',{blank:false})).map(o=>`<option value="${o.v}" ${o.v===f.cat?'selected':''}>${esc(o.t)}</option>`).join('')}</select>
    <select data-f="acc">${[{v:'',t:'Todas as contas'}].concat(UI.opts('accounts',{blank:false})).map(o=>`<option value="${o.v}" ${o.v===f.acc?'selected':''}>${esc(o.t)}</option>`).join('')}</select>
    ${(f.q||f.person||f.card||f.cat||f.acc)?'<button class="btn btn-s" data-act="fclear">limpar</button>':''}
  </div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card kpi" style="--bar:#F87171"><div class="lb">Saídas filtradas</div><div class="vl neg">${money(tot)}</div><div class="ft">${rows.length} lançamento(s)</div></div>
    <div class="card kpi" style="--bar:#10B981"><div class="lb">Entradas</div><div class="vl pos">${money(rec)}</div><div class="ft">no mês</div></div>
    <div class="card kpi" style="--bar:#6D28D9"><div class="lb">Resultado</div><div class="vl ${rec-tot>=0?'pos':'neg'}">${money(rec-tot)}</div><div class="ft">entradas − saídas</div></div>
  </div>
  <div class="card pad0"><div class="tw"><table>
    <thead><tr><th>Data</th><th>Descrição</th><th>Pessoa</th><th>Categoria</th><th>Origem</th><th></th><th class="num">Valor</th><th></th></tr></thead>
    <tbody>${rows.length?rows.map(r=>{
      const p=DB.get('people',r.personId),c=DB.get('categories',r.catId);
      const cd=DB.get('cards',r.cardId),ac=DB.get('accounts',r.accId);
      return `<tr>
        <td style="color:var(--muted);white-space:nowrap">${dmy(r.data)}</td>
        <td><b>${esc(r.desc||'—')}</b></td>
        <td>${p?`<span style="display:inline-flex;align-items:center;gap:7px">
          <span class="av" style="background:${p.cor||'#6D28D9'};width:24px;height:24px;flex:0 0 24px;font-size:10px">${ini(p.nome)}</span>
          ${esc(p.nome)}</span>`:'<span style="color:var(--muted2)">—</span>'}</td>
        <td>${c?`<span class="tag"><span class="dot" style="background:${c.cor}"></span>${esc(c.nome)}</span>`:'<span style="color:var(--muted2)">—</span>'}</td>
        <td style="color:var(--muted);white-space:nowrap">${cd?esc(cd.nome):ac?esc(ac.nome):'—'}</td>
        <td><span class="tag" style="${r.badge==='receita'?'color:#6EE7B7':r.tipo==='cartao'?'color:#C4B5FD':''}">${esc(r.badge)}</span></td>
        <td class="num ${r.tipo==='receita'?'pos':'neg'}"><b>${r.tipo==='receita'?'+':'−'}${money(r.valor)}</b></td>
        <td class="num"><button class="btn btn-s" data-act="${r.isTx?'tx-ed':'pu-ed'}" data-id="${r.ref}">editar</button></td>
      </tr>`;}).join(''):`<tr><td colspan="8"><div class="zs"><span class="em">📝</span>
        <h4>Nada em ${ymLb(m)}</h4><p>Toque em <b>+ Novo</b> para registrar uma compra, despesa ou receita.</p>
        <button class="btn btn-p" data-act="new">+ Fazer primeiro lançamento</button></div></td></tr>`}</tbody>
  </table></div></div>`;
};

/* ---------------- Recorrentes ---------------- */
V.rec=()=>{
  const m=state.month, list=DB.all('recurrences');
  const items=Recur.month(m), pend=items.filter(i=>i.status==='pendente');
  const soma=(t,c)=>r2(list.filter(r=>r.tipo===t&&Recur.hits(r,c)).reduce((s,r)=>s+(Number(r.valor)||0),0));
  const mIn=soma('receita',m), mOut=soma('despesa',m);
  const fut=Array.from({length:12},(_,k)=>{const c=ymAdd(m,k);
    return {label:ymLb(c).split('/')[0],value:soma('despesa',c)};});

  if(!list.length) return `<div class="card"><div class="zs">
    <span class="em">↻</span><h4>Nenhuma conta recorrente</h4>
    <p>Cadastre o que se repete todo mês e pare de digitar duas vezes a mesma coisa.</p>
    <div class="steps">
      <div class="st"><i>✓</i><span><b>Saídas fixas:</b> aluguel, internet, academia, assinaturas.</span></div>
      <div class="st"><i>✓</i><span><b>Entradas fixas:</b> salário, aluguel recebido, renda extra.</span></div>
      <div class="st"><i>✓</i><span>Marque <b>"lançar automaticamente"</b> e o app registra sozinho.</span></div>
    </div>
    <button class="btn btn-p" data-act="rc-new">+ Criar primeira recorrente</button></div></div>`;

  const stg=s=>s==='lancado'?'<span class="tag" style="color:#6EE7B7;border-color:#10B98155">lançado ✓</span>'
    :s==='pulado'?'<span class="tag" style="color:#71717A">pulado</span>'
    :'<span class="tag" style="color:#FCD34D;border-color:#F59E0B55">pendente</span>';

  return `
  <div class="grid g4" style="margin-bottom:6px">
    <div class="card kpi" style="--bar:#10B981"><div class="lb">Entradas fixas</div>
      <div class="vl pos">${money(mIn)}</div><div class="ft">${list.filter(r=>r.tipo==='receita'&&Recur.hits(r,m)).length} recorrência(s)</div></div>
    <div class="card kpi" style="--bar:#F87171"><div class="lb">Saídas fixas</div>
      <div class="vl neg">${money(mOut)}</div><div class="ft">${list.filter(r=>r.tipo==='despesa'&&Recur.hits(r,m)).length} recorrência(s)</div></div>
    <div class="card kpi" style="--bar:#6D28D9"><div class="lb">Resultado fixo</div>
      <div class="vl ${mIn-mOut>=0?'pos':'neg'}">${money(mIn-mOut)}</div><div class="ft">entradas − saídas</div></div>
    <div class="card kpi" style="--bar:#F59E0B"><div class="lb">Pendentes</div>
      <div class="vl wrn">${pend.length}</div><div class="ft">${money(r2(pend.reduce((s,i)=>s+(Number(i.r.valor)||0),0)))} em aberto</div></div>
  </div>
  ${pend.length?`<div class="card alert" style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap">
      <div style="flex:1;min-width:190px">
        <b style="font-size:15px">⏳ ${pend.length} conta(s) fixa(s) de ${ymLb(m)} não lançada(s)</b>
        <div style="color:var(--muted);font-size:13px;margin-top:4px">Só entram no total depois de confirmadas.</div></div>
      <button class="btn btn-p" data-act="rc-all">✓ Lançar todas</button></div></div>`:''}

  <div class="sec"><h2>Agenda de ${ymLbL(m)}</h2>
    <button class="btn btn-s btn-p" data-act="rc-new">+ Nova recorrente</button></div>
  <div class="card pad0"><div class="tw"><table>
    <thead><tr><th>Dia</th><th>Descrição</th><th>Status</th><th class="num">Valor</th><th></th></tr></thead>
    <tbody>${items.length?items.map(i=>{
      const r=i.r,o=Recur.origem(r),ct=DB.get('categories',r.categoryId),pe=DB.get('people',r.personId);
      return `<tr>
        <td style="color:var(--muted);white-space:nowrap">${dmy(i.data)}</td>
        <td><b>${esc(r.descricao||'—')}</b>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">
            ${o?`<span class="tag"><span class="dot" style="background:${o.cor}"></span>${esc(o.nome)}</span>`:''}
            ${ct?`<span class="tag"><span class="dot" style="background:${ct.cor}"></span>${esc(ct.nome)}</span>`:''}
            ${pe&&!pe.isOwner?`<span class="tag"><span class="dot" style="background:${pe.cor||'#6D28D9'}"></span>${esc(pe.nome)}</span>`:''}
            <span class="tag">${esc(Recur.FREQL[r.frequencia||'mensal'])}</span>
            ${r.auto?'<span class="tag" style="color:#C4B5FD;border-color:#6D28D955">auto</span>':''}</div></td>
        <td>${stg(i.status)}</td>
        <td class="num ${r.tipo==='receita'?'pos':'neg'}"><b>${r.tipo==='receita'?'+':'−'}${money(r.valor)}</b></td>
        <td class="num" style="white-space:nowrap">
          ${i.status==='pendente'?`<button class="btn btn-s btn-g" data-act="rc-post" data-id="${r.id}">✓ lançar</button>
            <button class="btn btn-s" data-act="rc-skip" data-id="${r.id}">pular</button>`:''}
          ${i.status==='lancado'?`<button class="btn btn-s" data-act="rc-unpost" data-id="${r.id}">↺ desfazer</button>`:''}
          ${i.status==='pulado'?`<button class="btn btn-s" data-act="rc-unskip" data-id="${r.id}">↺ retomar</button>`:''}
          <button class="btn btn-s" data-act="rc-ed" data-id="${r.id}">editar</button></td>
      </tr>`;}).join(''):`<tr><td colspan="5"><div class="empty"><b>Nada recorrente em ${ymLb(m)}</b>
        Navegue para outro mês ou cadastre uma nova.</div></td></tr>`}</tbody></table></div></div>

  <div class="sec"><h2>Compromisso fixo dos próximos 12 meses</h2></div>
  <div class="card">${Chart.line(fut)}</div>

  <div class="sec"><h2>Todas as recorrências</h2><span class="hint">${list.length} cadastrada(s)</span></div>
  ${['receita','despesa'].map(tp=>{
    const l=list.filter(r=>r.tipo===tp); if(!l.length) return '';
    return `<div class="card pad0" style="margin-bottom:14px">
      <div style="padding:13px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;color:${tp==='receita'?'#6EE7B7':'#FCA5A5'}">
        ${tp==='receita'?'ENTRADAS FIXAS':'SAÍDAS FIXAS'}</div>
      <div class="tw"><table>
      <thead><tr><th>Descrição</th><th>Origem</th><th>Frequência</th><th>Vigência</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>${l.map(r=>{const o=Recur.origem(r);
        return `<tr style="${r.ativo===false?'opacity:.45':''}">
          <td><b>${esc(r.descricao)}</b>${r.auto?' <span class="tag" style="color:#C4B5FD;border-color:#6D28D955">auto</span>':''}</td>
          <td>${o?`<span class="tag"><span class="dot" style="background:${o.cor}"></span>${esc(o.nome)}</span>`:'—'}</td>
          <td style="color:var(--muted)">${esc(Recur.FREQL[r.frequencia||'mensal'])} · dia ${r.diaVencimento||1}</td>
          <td style="color:var(--muted2);font-size:12.5px">${r.inicio?ymLb(r.inicio.slice(0,7)):'—'} → ${r.fim?ymLb(r.fim.slice(0,7)):'sem fim'}</td>
          <td class="num ${tp==='receita'?'pos':'neg'}"><b>${money(r.valor)}</b></td>
          <td class="num" style="white-space:nowrap">
            <button class="btn btn-s" data-act="rc-tog" data-id="${r.id}">${r.ativo===false?'ativar':'pausar'}</button>
            <button class="btn btn-s" data-act="rc-ed" data-id="${r.id}">editar</button>
            <button class="btn btn-s btn-d" data-act="rc-del" data-id="${r.id}">✕</button></td>
        </tr>`;}).join('')}</tbody></table></div></div>`;
  }).join('')}`;
};

/* ---------------- Cartões ---------------- */
V.cards=()=>{
  const m=state.month, cards=DB.all('cards');
  if(!cards.length) return `<div class="card"><div class="zs">
    <span class="em">💳</span><h4>Nenhum cartão cadastrado</h4>
    <p>Com o cartão cadastrado você acompanha fatura, limite e <b>quanto cada pessoa gastou nele</b>.</p>
    <div class="steps">
      <div class="st"><i>1</i><span>Informe <b>nome, limite e bandeira</b>.</span></div>
      <div class="st"><i>2</i><span>Defina o <b>dia de fechamento</b> — compras depois dele vão pra fatura seguinte.</span></div>
      <div class="st"><i>3</i><span>Defina o <b>dia de vencimento</b> para receber alertas.</span></div>
    </div>
    <button class="btn btn-p" data-act="card-new">+ Cadastrar cartão</button></div></div>`;
  return cards.map(c=>{
    const inv=Model.invoice(c.id,m), used=Model.cardUsed(c.id);
    const lim=Number(c.limite)||0,pc=lim?Math.min(100,used/lim*100):0;
    const byP={}; inv.itens.forEach(i=>{byP[i.personId||'_']=(byP[i.personId||'_']||0)+i.valor;});
    const people=Object.entries(byP).map(([pid,v])=>{const p=DB.get('people',pid);
      return {label:p?p.nome:'Sem pessoa',color:p?p.cor:'#52525B',value:r2(v),isOwner:p?p.isOwner:true};
    }).sort((a,b)=>b.value-a.value);
    return `<div class="card" style="margin-bottom:18px">
      <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="width:54px;height:36px;border-radius:7px;flex:0 0 54px;background:linear-gradient(135deg,${c.cor||'#6D28D9'},#0A0A0B)"></div>
        <div style="flex:1;min-width:150px">
          <b style="font-size:16.5px">${esc(c.nome)}</b>
          <div style="color:var(--muted2);font-size:12px">${esc(c.bandeira||'')} ${c.ultimos4?'•••• '+esc(c.ultimos4):''} · fecha dia ${c.diaFechamento||'—'} · vence dia ${c.diaVencimento||'—'}</div></div>
        <div style="text-align:right">
          <div style="color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">Fatura ${ymLb(m)}</div>
          <div style="font-size:25px;font-weight:750;letter-spacing:-.7px">${money(inv.total)}</div>
          <div style="color:var(--muted2);font-size:11.5px">vence ${dmyF(dateOf(m,c.diaVencimento))}</div></div>
      </div>
      <div style="margin:16px 0 6px" class="bar-t"><div class="bar-f" style="width:${pc}%;background:${pc>85?'var(--crit)':c.cor||'#6D28D9'}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted2);flex-wrap:wrap;gap:6px">
        <span>comprometido <b style="color:var(--text)">${money(used)}</b></span>
        <span>disponível <b class="pos">${money(Math.max(0,lim-used))}</b> de ${money(lim)}</span></div>
      ${people.length?`<div style="margin-top:18px">
        <div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px">QUEM GASTOU NESTA FATURA</div>
        ${people.map(p=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0">
          <span class="dot" style="background:${p.color}"></span>
          <span style="flex:1;font-size:13.5px">${esc(p.label)}${p.isOwner?'':' <span class="tag" style="color:#FCA5A5;border-color:#DC262655">deve</span>'}</span>
          <span style="color:var(--muted2);font-size:12px">${(p.value/(inv.total||1)*100).toFixed(0)}%</span>
          <b style="font-variant-numeric:tabular-nums;min-width:96px;text-align:right">${money(p.value)}</b>
        </div>`).join('')}</div>`:''}
      <div style="display:flex;gap:9px;margin-top:17px;flex-wrap:wrap">
        <button class="btn btn-p btn-s" data-act="pu-new" data-card="${c.id}">+ Compra</button>
        ${inv.total>0?(inv.paga?`<button class="btn btn-s" data-act="inv-un" data-card="${c.id}">↺ Desmarcar paga</button>`
          :`<button class="btn btn-g btn-s" data-act="inv-pay" data-card="${c.id}">✓ Marcar como paga</button>`):''}
        <button class="btn btn-s" data-act="card-ed" data-id="${c.id}">editar cartão</button></div>
      ${inv.itens.length?`<div class="tw" style="margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden">
        <table><thead><tr><th>Compra</th><th>Pessoa</th><th>Categoria</th><th>Parcela</th><th class="num">Valor</th></tr></thead>
        <tbody>${inv.itens.slice().sort((a,b)=>b.valor-a.valor).map(i=>{
          const p=DB.get('people',i.personId),ct=DB.get('categories',i.categoryId);
          return `<tr><td><b>${esc(i.descricao||'—')}</b></td><td>${p?esc(p.nome):'—'}</td>
            <td>${ct?`<span class="tag"><span class="dot" style="background:${ct.cor}"></span>${esc(ct.nome)}</span>`:'—'}</td>
            <td><span class="tag">${i.n}/${i.de}</span>${i.paga?' <span class="tag" style="color:#6EE7B7;border-color:#10B98155">paga</span>':''}</td>
            <td class="num"><b>${money(i.valor)}</b></td></tr>`;}).join('')}</tbody></table>
      </div>`:`<div class="empty">Nenhuma compra nesta fatura</div>`}
    </div>`;
  }).join('')+`<button class="btn" data-act="card-new">+ Novo cartão</button>`;
};

/* ---------------- Parcelamentos ---------------- */
V.parc=()=>{
  const list=DB.all('purchases').filter(p=>(Number(p.numParcelas)||1)>1);
  const enrich=list.map(p=>{
    const ps=Model.parcelsOf(p), pagas=ps.filter(i=>i.paga);
    return {p,ps,pagas:pagas.length,
      pago:r2(pagas.reduce((s,i)=>s+i.valor,0)),
      restante:r2(ps.filter(i=>!i.paga).reduce((s,i)=>s+i.valor,0)),
      fim:ps[ps.length-1].comp};
  }).sort((a,b)=>b.restante-a.restante);

  if(!enrich.length) return `<div class="card"><div class="zs">
    <span class="em">📆</span><h4>Nenhuma compra parcelada</h4>
    <p>Aqui você enxerga o quanto do seu futuro já está comprometido — e quando fica livre de novo.</p>
    <div class="steps">
      <div class="st"><i>✓</i><span>Lance uma compra e informe o <b>número de parcelas</b>.</span></div>
      <div class="st"><i>✓</i><span>Se o parcelamento <b>já começou</b>, informe quantas você já pagou.</span></div>
      <div class="st"><i>✓</i><span>O app projeta as parcelas futuras automaticamente.</span></div>
    </div>
    <button class="btn btn-p" data-act="pu-new">+ Lançar compra parcelada</button></div></div>`;

  const totRest=r2(enrich.reduce((s,e)=>s+e.restante,0));
  const mesAtual=r2(Model.parcelsIn(state.month).filter(i=>i.de>1).reduce((s,i)=>s+i.valor,0));
  const fut=Array.from({length:12},(_,k)=>{const c=ymAdd(state.month,k);
    return {label:ymLb(c).split('/')[0],
      value:r2(Model.parcelsIn(c).filter(i=>i.de>1).reduce((s,i)=>s+i.valor,0))};});

  return `
  <div class="grid g3" style="margin-bottom:6px">
    <div class="card kpi" style="--bar:#F87171"><div class="lb">Dívida total em aberto</div>
      <div class="vl neg">${money(totRest)}</div><div class="ft">${enrich.length} parcelamento(s) ativo(s)</div></div>
    <div class="card kpi" style="--bar:#6D28D9"><div class="lb">Parcelas de ${ymLb(state.month)}</div>
      <div class="vl">${money(mesAtual)}</div><div class="ft">comprometido no mês</div></div>
    <div class="card kpi" style="--bar:#F59E0B"><div class="lb">Quita em</div>
      <div class="vl">${ymLb(enrich.map(e=>e.fim).sort().pop())}</div>
      <div class="ft">último vencimento previsto</div></div>
  </div>
  <div class="sec"><h2>Compromisso dos próximos 12 meses</h2></div>
  <div class="card">${Chart.line(fut)}</div>
  <div class="sec"><h2>Parcelamentos</h2>
    <button class="btn btn-s btn-p" data-act="pu-new">+ Compra parcelada</button></div>
  ${enrich.map(({p,ps,pagas,pago,restante,fim})=>{
    const c=DB.get('cards',p.cardId),pe=DB.get('people',p.personId),ct=DB.get('categories',p.categoryId);
    const n=ps.length,pc=pagas/n*100;
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:170px">
          <b style="font-size:15.5px">${esc(p.descricao||'Compra')}</b>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:7px">
            ${c?`<span class="tag"><span class="dot" style="background:${c.cor||'#6D28D9'}"></span>${esc(c.nome)}</span>`:''}
            ${pe?`<span class="tag"><span class="dot" style="background:${pe.cor||'#6D28D9'}"></span>${esc(pe.nome)}</span>`:''}
            ${ct?`<span class="tag"><span class="dot" style="background:${ct.cor}"></span>${esc(ct.nome)}</span>`:''}
            <span class="tag">${dmyF(p.dataCompra)}</span></div></div>
        <div style="text-align:right">
          <div style="font-size:19px;font-weight:750">${money(p.valorTotal)}</div>
          <div style="color:var(--muted2);font-size:12px">${n}× ${money(ps[0].valor)}</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:11px;margin-top:14px">
        <div class="bar-t" style="flex:1"><div class="bar-f" style="width:${pc}%;background:linear-gradient(90deg,var(--primary),var(--primary2))"></div></div>
        <b style="font-size:12.5px;white-space:nowrap">${pagas}/${n} pagas</b></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted2);margin-top:7px;flex-wrap:wrap;gap:8px">
        <span>já pago <b class="pos">${money(pago)}</b></span>
        <span>falta <b class="neg">${money(restante)}</b></span>
        <span>termina em <b style="color:var(--text)">${ymLb(fim)}</b></span></div>
      <div style="display:flex;gap:8px;margin-top:13px;flex-wrap:wrap">
        <button class="btn btn-s btn-g" data-act="pay1" data-id="${p.id}" ${pagas>=n?'disabled style="opacity:.4"':''}>✓ Pagar parcela ${Math.min(pagas+1,n)}</button>
        <button class="btn btn-s" data-act="unpay1" data-id="${p.id}" ${pagas<=0?'disabled style="opacity:.4"':''}>↺ Desfazer</button>
        <button class="btn btn-s" data-act="pu-ed" data-id="${p.id}">editar</button>
        <button class="btn btn-s" data-act="pu-sched" data-id="${p.id}">ver cronograma</button></div>
    </div>`;}).join('')}`;
};

/* ---------------- Pessoas ---------------- */
V.peop=()=>{
  const m=state.month, ppl=Model.peopleStats(m);
  const others=ppl.filter(p=>!p.isOwner);
  if(!others.length) return `<div class="card"><div class="zs">
    <span class="em">👥</span><h4>Ninguém cadastrado ainda</h4>
    <p>Este é o recurso que quase nenhum app tem: saber <b>exatamente quanto cada familiar gastou no seu cartão</b> e quanto ainda te deve.</p>
    <div class="steps">
      <div class="st"><i>1</i><span>Cadastre a pessoa (mãe, irmão, cônjuge…).</span></div>
      <div class="st"><i>2</i><span>Ao lançar uma compra, escolha <b>quem fez</b>.</span></div>
      <div class="st"><i>3</i><span>Quando ela te pagar, toque em <b>Registrar pagamento</b>.</span></div>

  return `
  <div class="grid g3" style="margin-bottom:6px">
    <div class="card kpi" style="--bar:#F59E0B"><div class="lb">Total a receber</div>
      <div class="vl wrn">${money(totDev)}</div><div class="ft">${others.filter(p=>p.saldo>.01).length} de ${others.length} pessoa(s)</div></div>
    <div class="card kpi" style="--bar:#6D28D9"><div class="lb">Parcelas futuras de terceiros</div>
      <div class="vl">${money(totFut)}</div><div class="ft">ainda não venceram</div></div>
    <div class="card kpi" style="--bar:#10B981"><div class="lb">Recebido em ${ymLb(m)}</div>
      <div class="vl pos">${money(r2(others.reduce((s,p)=>s+p.pagoMes,0)))}</div><div class="ft">pagamentos registrados</div></div>
  </div>
  <div class="sec"><h2>Pessoas</h2><button class="btn btn-s btn-p" data-act="pe-new">+ Nova pessoa</button></div>
  ${ppl.map(p=>{
    const pcs=Model.parcels().filter(i=>i.personId===p.id&&i.comp===m).sort((a,b)=>b.valor-a.valor);
    const sett=DB.all('settlements').filter(s=>s.personId===p.id)
      .sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,4);
    return `<div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:13px;flex-wrap:wrap">
        <span class="av" style="background:${p.cor||'#6D28D9'};width:42px;height:42px;flex:0 0 42px;font-size:15px">${ini(p.nome)}</span>
        <div style="flex:1;min-width:130px">
          <b style="font-size:16px">${esc(p.nome)}</b>
          ${p.isOwner?' <span class="tag" style="color:#C4B5FD;border-color:#6D28D955">você</span>':''}
          <div style="color:var(--muted2);font-size:12px">gastou ${money(p.mes)} em ${ymLb(m)}</div></div>
        ${!p.isOwner?`<div style="text-align:right">
          <div style="color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">Deve agora</div>
          <div style="font-size:24px;font-weight:750;letter-spacing:-.6px" class="${p.saldo>.01?'neg':'pos'}">${money(Math.max(0,p.saldo))}</div>
          ${p.futuro?`<div style="color:var(--muted2);font-size:11.5px">+ ${money(p.futuro)} em parcelas futuras</div>`:''}
        </div>`:''}
      </div>
      ${!p.isOwner?`<div class="grid g3" style="margin-top:15px;gap:10px">
        <div style="background:var(--elev);border-radius:11px;padding:11px">
          <div style="font-size:11px;color:var(--muted2);font-weight:700">GASTOU ATÉ HOJE</div>
          <b style="font-size:15.5px">${money(p.ateHoje)}</b></div>
        <div style="background:var(--elev);border-radius:11px;padding:11px">
          <div style="font-size:11px;color:var(--muted2);font-weight:700">JÁ ME PAGOU</div>
          <b style="font-size:15.5px" class="pos">${money(p.pago)}</b></div>
        <div style="background:var(--elev);border-radius:11px;padding:11px">
          <div style="font-size:11px;color:var(--muted2);font-weight:700">SALDO</div>
          <b style="font-size:15.5px" class="${p.saldo>.01?'neg':'pos'}">${money(p.saldo)}</b></div>
      </div>`:''}
      ${pcs.length?`<div class="tw" style="margin-top:15px;border:1px solid var(--line);border-radius:11px;overflow:hidden">
        <table><thead><tr><th>Compra em ${ymLb(m)}</th><th>Cartão</th><th>Parcela</th><th class="num">Valor</th></tr></thead>
        <tbody>${pcs.map(i=>{const c=DB.get('cards',i.cardId);
          return `<tr><td>${esc(i.descricao||'—')}</td><td style="color:var(--muted)">${c?esc(c.nome):'—'}</td>
          <td><span class="tag">${i.n}/${i.de}</span></td><td class="num"><b>${money(i.valor)}</b></td></tr>`;}).join('')}
        </tbody></table></div>`:''}
      ${sett.length?`<div style="margin-top:13px">
        <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:7px">ÚLTIMOS PAGAMENTOS RECEBIDOS</div>
        ${sett.map(s=>`<div style="display:flex;gap:10px;align-items:center;font-size:13px;padding:5px 0">
          <span style="color:var(--muted2)">${dmyF(s.data)}</span>
          <span style="flex:1;color:var(--muted)">${esc(s.observacao||'pagamento')}</span>
          <b class="pos">+${money(s.valor)}</b>
