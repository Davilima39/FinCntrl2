      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        ${!p.isOwner?`<button class="btn btn-s btn-g" data-act="st-new" data-id="${p.id}">＄ Registrar pagamento</button>`:''}
        <button class="btn btn-s" data-act="pe-ed" data-id="${p.id}">editar</button>
        ${!p.isOwner?`<button class="btn btn-s btn-d" data-act="pe-del" data-id="${p.id}">excluir</button>`:''}</div>
    </div>`;}).join('')}`;
};

/* ---------------- Cofrinhos ---------------- */
V.vault=()=>{
  const vs=DB.all('vaults'), tot=Model.vaultTotal(), m=state.month;
  if(!vs.length) return `<div class="card"><div class="zs">
    <span class="em">🐷</span><h4>Nenhum cofrinho ainda</h4>
    <p>Separe o dinheiro que você está guardando por objetivo e veja o progresso de cada meta.</p>
    <div class="steps">
      <div class="st"><i>1</i><span>Crie um cofrinho com <b>nome e valor da meta</b>.</span></div>
      <div class="st"><i>2</i><span>Toque em <b>Guardar</b> sempre que fizer um aporte.</span></div>
      <div class="st"><i>3</i><span>O app calcula <b>em quantos meses</b> você chega lá.</span></div>
    </div>
    <button class="btn btn-p" data-act="vt-new">+ Criar primeiro cofrinho</button></div></div>`;

  const apM=r2(DB.all('vaultMovements').filter(x=>(x.data||'').slice(0,7)===m&&x.valor>0)
    .reduce((s,x)=>s+x.valor,0));
  const evo=Array.from({length:12},(_,i)=>{const x=ymAdd(m,-11+i);
    return {label:ymLb(x).split('/')[0],
      value:r2(DB.all('vaultMovements').filter(v=>(v.data||'')<=dateOf(x,31))
        .reduce((s,v)=>s+(Number(v.valor)||0),0))};});

  return `
  <div class="grid g3" style="margin-bottom:6px">
    <div class="card kpi" style="--bar:#10B981"><div class="lb">Total guardado</div>
      <div class="vl pos">${money(tot)}</div><div class="ft">${vs.length} cofrinho(s)</div></div>
    <div class="card kpi" style="--bar:#6D28D9"><div class="lb">Guardado em ${ymLb(m)}</div>
      <div class="vl">${money(apM)}</div><div class="ft">aportes do mês</div></div>
    <div class="card kpi" style="--bar:#FBBF24"><div class="lb">Meta somada</div>
      <div class="vl">${money(r2(vs.reduce((s,v)=>s+(Number(v.metaValor)||0),0)))}</div>
      <div class="ft">${(()=>{const M=vs.reduce((s,v)=>s+(Number(v.metaValor)||0),0);
        return M?Math.round(tot/M*100)+'% alcançado':'sem metas';})()}</div></div>
  </div>
  <div class="sec"><h2>Evolução do que você guardou</h2></div>
  <div class="card">${Chart.line(evo)}</div>
  <div class="sec"><h2>Meus cofrinhos</h2><button class="btn btn-s btn-p" data-act="vt-new">+ Novo cofrinho</button></div>
  <div class="grid g2">${vs.map(v=>{
    const b=Model.vaultBalance(v.id),mt=Number(v.metaValor)||0,pc=mt?b/mt:0;
    const movs=DB.all('vaultMovements').filter(x=>x.vaultId===v.id)
      .sort((a,b2)=>(b2.data||'').localeCompare(a.data||'')).slice(0,5);
    const med=(()=>{const ap=DB.all('vaultMovements').filter(x=>x.vaultId===v.id&&x.valor>0);
      if(!ap.length)return 0;const ms=new Set(ap.map(x=>(x.data||'').slice(0,7)));
      return r2(ap.reduce((s,x)=>s+x.valor,0)/ms.size);})();
    const falta=Math.max(0,mt-b), prev=med>0&&falta>0?Math.ceil(falta/med):0;
    return `<div class="card ${pc>=1?'goal-hit':''}">
      <div style="display:flex;align-items:center;gap:15px">
        <div style="position:relative;flex:0 0 96px;height:96px">
          ${Chart.ring(pc,pc>=1?'#FBBF24':(v.cor||'#10B981'))}
          <div style="position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:750">
            ${pc>=1?'🎉':mt?Math.round(pc*100)+'%':'—'}</div></div>
        <div style="flex:1;min-width:0">
          <b style="font-size:15.5px">${esc(v.icone||'')} ${esc(v.nome)}</b>
          <div style="font-size:23px;font-weight:750;letter-spacing:-.6px;margin-top:4px">${money(b)}</div>
          <div style="color:var(--muted2);font-size:12px">${mt?(pc>=1?`meta de ${money(mt)} batida!`:`meta ${money(mt)} · falta ${money(falta)}`):'sem meta definida'}</div>
          ${prev?`<div style="color:var(--muted2);font-size:11.5px;margin-top:3px">≈ ${prev} ${prev===1?'mês':'meses'} no ritmo atual (${money(med)}/mês)</div>`:''}
        </div></div>
      ${movs.length?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:11px">
        ${movs.map(x=>`<div style="display:flex;gap:10px;align-items:center;font-size:13px;padding:4px 0">
          <span style="color:var(--muted2);white-space:nowrap">${dmyF(x.data)}</span>
          <span style="flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.observacao||x.tipo||'')}</span>
          <b class="${x.valor>=0?'pos':'neg'}">${x.valor>=0?'+':'−'}${money(Math.abs(x.valor))}</b>
          <button class="btn btn-s" data-act="vm-del" data-id="${x.id}">✕</button></div>`).join('')}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-s btn-g" data-act="vm-in" data-id="${v.id}">↑ Guardar</button>
        <button class="btn btn-s btn-d" data-act="vm-out" data-id="${v.id}">↓ Resgatar</button>
        <button class="btn btn-s" data-act="vt-ed" data-id="${v.id}">editar</button></div>
    </div>`;}).join('')}</div>`;
};

/* ---------------- Relatórios ---------------- */
V.rep=()=>{
  const m=state.month;
  const cats=Model.byCategory(m), tot=r2(cats.reduce((s,c)=>s+c.value,0));
  const ppl=Model.peopleStats(m);
  const months=Array.from({length:12},(_,i)=>ymAdd(m,-11+i));
  const evo=months.map(x=>({label:ymLb(x).split('/')[0],value:Model.monthSpend(x).total}));
  const inc=months.map(x=>({label:ymLb(x).split('/')[0],value:Model.monthIncome(x)}));
  const prevCats=Model.byCategory(ymAdd(m,-1));
  const media=r2(evo.reduce((s,e)=>s+e.value,0)/12);
  const cardsD=DB.all('cards').map(c=>({label:c.nome,value:Model.invoice(c.id,m).total,color:c.cor||'#6D28D9'}));

  return `
  <div class="grid g4" style="margin-bottom:6px">
    <div class="card kpi" style="--bar:#F87171"><div class="lb">Gasto em ${ymLb(m)}</div>
      <div class="vl neg">${money(tot)}</div><div class="ft">média 12m ${money(media)}</div></div>
    <div class="card kpi" style="--bar:#10B981"><div class="lb">Receita</div>
      <div class="vl pos">${money(Model.monthIncome(m))}</div><div class="ft">no mês</div></div>
    <div class="card kpi" style="--bar:#6D28D9"><div class="lb">Maior categoria</div>
      <div class="vl" style="font-size:19px">${cats[0]?esc(cats[0].label):'—'}</div>
      <div class="ft">${cats[0]?money(cats[0].value)+' · '+(cats[0].value/tot*100).toFixed(0)+'%':'sem dados'}</div></div>
    <div class="card kpi" style="--bar:#FBBF24"><div class="lb">Taxa de poupança</div>
      <div class="vl">${(()=>{const i=Model.monthIncome(m);
        return i?Math.round(Math.max(0,(i-tot)/i*100))+'%':'—';})()}</div>
      <div class="ft">da receita do mês</div></div>
  </div>
  <div class="sec"><h2>Distribuição por categoria</h2>
    <button class="btn btn-s" data-act="csv">↓ Exportar CSV</button></div>
  <div class="grid g21">
    <div class="card"><div class="donut-wrap">${Chart.donut(cats,190,26)}${cats.length?Chart.legend(cats,9):''}</div></div>
    <div class="card pad0"><div class="tw"><table>
      <thead><tr><th>Categoria</th><th class="num">Valor</th><th class="num">%</th><th class="num">vs mês ant.</th></tr></thead>
      <tbody>${cats.length?cats.map(c=>{
        const pv=(prevCats.find(x=>x.id===c.id)||{value:0}).value;
        const d=pv?((c.value-pv)/pv*100):null;
        return `<tr><td><span class="tag"><span class="dot" style="background:${c.color}"></span>${esc(c.label)}</span></td>
          <td class="num"><b>${money(c.value)}</b></td>
          <td class="num" style="color:var(--muted)">${(c.value/tot*100).toFixed(1)}%</td>
          <td class="num ${d===null?'':d>0?'neg':'pos'}">${d===null?'<span style="color:var(--muted2)">novo</span>'
            :(d>0?'▲':'▼')+' '+Math.abs(d).toFixed(0)+'%'}</td></tr>`;
        }).join(''):'<tr><td colspan="4"><div class="empty">Sem dados</div></td></tr>'}</tbody>
    </table></div></div>
  </div>
  <div class="sec"><h2>Gasto × Receita — 12 meses</h2></div>
  <div class="grid g2">
    <div class="card"><div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:10px">GASTOS</div>${Chart.line(evo)}</div>
    <div class="card"><div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:10px">RECEITAS</div>${Chart.line(inc)}</div>
  </div>
  <div class="sec"><h2>Comparativos de ${ymLb(m)}</h2></div>
  <div class="grid g2">
    <div class="card"><div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:10px">POR PESSOA</div>
      ${Chart.bars(ppl.filter(p=>p.mes>0).map(p=>({label:p.nome,value:p.mes,color:p.cor||'#6D28D9'})))}</div>
    <div class="card"><div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:10px">POR CARTÃO</div>
      ${Chart.bars(cardsD.filter(c=>c.value>0))}</div>
  </div>`;
};

/* ---------------- Configurações ---------------- */
V.cfg=()=>{
  const t=state.tab.cfg||'accounts';
  const tabs=[['accounts','Contas'],['cards','Cartões'],['people','Pessoas'],
              ['categories','Categorias'],['backup','Backup']];
  let body='';
  if(t==='accounts'){
    const l=DB.all('accounts');
    body=`<div class="card pad0"><div class="tw"><table>
      <thead><tr><th>Conta</th><th>Tipo</th><th>Banco</th><th class="num">Saldo atual</th><th></th></tr></thead>
      <tbody>${l.length?l.map(a=>`<tr>
        <td><span class="tag"><span class="dot" style="background:${a.cor||'#8B5CF6'}"></span>${esc(a.nome)}</span></td>
        <td style="color:var(--muted)">${esc(a.tipo||'—')}</td><td style="color:var(--muted)">${esc(a.banco||'—')}</td>
        <td class="num"><b class="${Model.accountBalance(a.id)>=0?'pos':'neg'}">${money(Model.accountBalance(a.id))}</b></td>
        <td class="num"><button class="btn btn-s" data-act="ac-ed" data-id="${a.id}">editar</button>
        <button class="btn btn-s btn-d" data-act="ac-del" data-id="${a.id}">✕</button></td></tr>`).join('')
        :'<tr><td colspan="5"><div class="empty">Nenhuma conta</div></td></tr>'}</tbody></table></div></div>
      <button class="btn btn-p" style="margin-top:13px" data-act="ac-new">+ Nova conta</button>`;
  } else if(t==='cards'){
    const l=DB.all('cards');
    body=`<div class="card pad0"><div class="tw"><table>
      <thead><tr><th>Cartão</th><th>Bandeira</th><th>Fecha</th><th>Vence</th><th class="num">Limite</th><th class="num">Usado</th><th></th></tr></thead>
      <tbody>${l.length?l.map(c=>`<tr>
        <td><span class="tag"><span class="dot" style="background:${c.cor||'#6D28D9'}"></span>${esc(c.nome)}</span>
          ${c.ultimos4?`<span style="color:var(--muted2);font-size:12px"> ••••${esc(c.ultimos4)}</span>`:''}</td>
        <td style="color:var(--muted)">${esc(c.bandeira||'—')}</td>
        <td style="color:var(--muted)">dia ${c.diaFechamento||'—'}</td>
        <td style="color:var(--muted)">dia ${c.diaVencimento||'—'}</td>
        <td class="num">${money(c.limite)}</td><td class="num neg">${money(Model.cardUsed(c.id))}</td>
        <td class="num"><button class="btn btn-s" data-act="card-ed" data-id="${c.id}">editar</button>
        <button class="btn btn-s btn-d" data-act="card-del" data-id="${c.id}">✕</button></td></tr>`).join('')
        :'<tr><td colspan="7"><div class="empty">Nenhum cartão</div></td></tr>'}</tbody></table></div></div>
      <button class="btn btn-p" style="margin-top:13px" data-act="card-new">+ Novo cartão</button>`;
  } else if(t==='people'){
    body=`<div class="card pad0"><div class="tw"><table>
      <thead><tr><th>Pessoa</th><th>Tipo</th><th class="num">Deve hoje</th><th></th></tr></thead>
      <tbody>${Model.peopleStats(state.month).map(p=>`<tr>
        <td><span style="display:inline-flex;align-items:center;gap:9px">
          <span class="av" style="background:${p.cor||'#6D28D9'}">${ini(p.nome)}</span>${esc(p.nome)}</span></td>
        <td>${p.isOwner?'<span class="tag" style="color:#C4B5FD">titular</span>':'<span class="tag">familiar</span>'}</td>
        <td class="num">${p.isOwner?'—':`<b class="${p.saldo>.01?'neg':'pos'}">${money(p.saldo)}</b>`}</td>
        <td class="num"><button class="btn btn-s" data-act="pe-ed" data-id="${p.id}">editar</button>
        ${p.isOwner?'':`<button class="btn btn-s btn-d" data-act="pe-del" data-id="${p.id}">✕</button>`}</td></tr>`).join('')}
      </tbody></table></div></div>
      <button class="btn btn-p" style="margin-top:13px" data-act="pe-new">+ Nova pessoa</button>`;
  } else if(t==='categories'){
    const l=DB.all('categories');
    body=`<div class="grid g2">
      ${['despesa','receita'].map(tp=>`<div class="card">
        <div style="font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:12px">${tp.toUpperCase()}S</div>
        ${l.filter(c=>c.tipo===tp).map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0">
          <span class="dot" style="background:${c.cor}"></span><span style="flex:1">${esc(c.nome)}</span>
          <button class="btn btn-s" data-act="ct-ed" data-id="${c.id}">editar</button>
          <button class="btn btn-s btn-d" data-act="ct-del" data-id="${c.id}">✕</button></div>`).join('')
          ||'<div class="empty">Nenhuma</div>'}
      </div>`).join('')}</div>
      <button class="btn btn-p" style="margin-top:13px" data-act="ct-new">+ Nova categoria</button>`;
  } else {
    body=`<div class="card">
      <b style="font-size:15px">Backup e portabilidade</b>
      <p style="color:var(--muted);font-size:13.5px;margin:9px 0 16px;line-height:1.65">
        Seus dados são salvos no navegador e sincronizados automaticamente com a nuvem pelo Firebase.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn btn-p" data-act="exp">↓ Exportar JSON</button>
        <button class="btn" data-act="imp">↑ Importar JSON</button>
        <button class="btn" data-act="csv">↓ Exportar CSV do mês</button></div>
      <input type="file" id="impFile" accept="application/json" style="display:none"></div>
    <div class="card" style="margin-top:14px">
      <b style="font-size:15px">Dados de demonstração</b>
      <p style="color:var(--muted);font-size:13.5px;margin:9px 0 16px;line-height:1.65">
        Popula contas, cartões, familiares, parcelamentos, recorrentes e cofrinhos de exemplo.</p>
      <button class="btn" data-act="demo">✨ Carregar exemplo</button></div>
    <div class="card" style="margin-top:14px;border-color:rgba(220,38,38,.35)">
      <b style="font-size:15px" class="crit">Zona de risco</b>
      <p style="color:var(--muted);font-size:13.5px;margin:9px 0 16px">Apaga tudo permanentemente.</p>
      <button class="btn btn-d" data-act="wipe">Apagar todos os dados</button></div>`;
  }
  return `<div class="seg" style="margin-bottom:18px">
    ${tabs.map(([k,lb])=>`<button class="${k===t?'on':''}" data-act="cfgtab" data-t="${k}">${lb}</button>`).join('')}
  </div>${body}`;
};

/* ==================================================================
   FORMULÁRIOS E AÇÕES
   ================================================================== */
const F={
  purchase(id,presetCard){
    const p=id?DB.get('purchases',id):null;
    if(!DB.all('cards').length){ UI.toast('Cadastre um cartão primeiro'); go('cfg'); return; }
    const paidCount=p&&Array.isArray(p.paid)?p.paid.length:(p?Number(p.parcelasPagas)||0:0);
    UI.form({
      title:p?'Editar compra no cartão':'Nova compra no cartão',
      submitLabel:p?'Salvar':'Lançar',
      values:p||{dataCompra:todayISO(),numParcelas:1,parcelasPagas:0,cardId:presetCard||'',shareType:'owner',sharePct:0,
        personId:(DB.all('people').find(x=>x.isOwner)||{}).id},
      fields:[
        {name:'descricao',label:'Descrição',required:true,placeholder:'Ex.: Notebook, mercado, farmácia'},
        {name:'local',label:'Estabelecimento',placeholder:'Onde comprou (opcional)'},
        {name:'valorTotal',label:'Valor total (R$)',type:'money',required:true,half:true},
        {name:'dataCompra',label:'Data da compra',type:'date',required:true,half:true},
        {name:'cardId',label:'Cartão',type:'select',required:true,options:UI.opts('cards',{blank:false}),half:true},
        {name:'personId',label:'Pessoa relacionada',type:'select',options:UI.opts('people',{blank:'— não definido —'}),half:true},
        {name:'shareType',label:'De quem é o gasto',type:'select',options:[
          {v:'owner',t:'Meu — não vou cobrar'},{v:'other',t:'Toda da outra pessoa — vou cobrar 100%'},{v:'split',t:'Dividida — cobro uma parte'}],half:true},
        {name:'sharePct',label:'Quanto cobrar (%)',type:'number',min:0,max:100,half:true,hint:'Só vale para compra dividida'},
        {name:'numParcelas',label:'Nº de parcelas',type:'number',min:1,def:1,half:true},
        {name:'parcelasPagas',label:'Parcelas pagas',type:'number',min:0,def:paidCount,half:true,hint:'Usado para cadastrar parcelamento já em andamento'},
        {name:'categoryId',label:'Categoria',type:'select',options:UI.opts('categories',{blank:'— sem categoria —',filter:c=>c.tipo==='despesa'})},
        {name:'observacao',label:'Observação',type:'textarea'}
      ],
      extraFoot:p?`<button class="btn btn-d" id="delp" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){
        v.numParcelas=Math.max(1,Math.round(Number(v.numParcelas)||1));
        v.parcelasPagas=Math.min(v.numParcelas,Math.max(0,Math.round(Number(v.parcelasPagas)||0)));
        v.sharePct=Math.min(100,Math.max(0,Number(v.sharePct)||0));
        if(v.shareType==='other')v.sharePct=100;if(v.shareType==='owner')v.sharePct=0;
        const manter=p&&Array.isArray(p.paid)&&v.parcelasPagas===p.paid.length;
        v.paid=manter?p.paid.filter(k=>k<=v.numParcelas):Array.from({length:v.parcelasPagas},(_,i)=>i+1);
        p?DB.update('purchases',p.id,v):DB.insert('purchases',v);
        UI.close(); render(); UI.toast(p?'Compra atualizada ✓':'Compra lançada ✓');
      }
    });
    if(p) $('#delp').onclick=()=>{UI.close();
      UI.confirm(`Excluir "${p.descricao}" e todas as suas parcelas?`,
        ()=>{DB.remove('purchases',p.id);render();UI.toast('Excluído');});};
  },
  tx(id,tipo){
    const t=id?DB.get('transactions',id):null;
    const tp=t?t.tipo:(tipo||'despesa');
    if(!DB.all('accounts').length){ UI.toast('Cadastre uma conta primeiro'); go('cfg'); return; }
    UI.form({
      title:t?'Editar lançamento':(tp==='receita'?'Nova receita':tp==='transferencia'?'Nova transferência':'Nova despesa'),
      submitLabel:t?'Salvar':'Lançar',
      values:t||{tipo:tp,data:todayISO(),personId:(DB.all('people').find(x=>x.isOwner)||{}).id},
      fields:[
        {name:'tipo',label:'Tipo',type:'select',required:true,options:[
          {v:'despesa',t:'Despesa (débito/dinheiro/pix)'},{v:'receita',t:'Receita'},
          {v:'transferencia',t:'Transferência entre contas'}]},
        {name:'descricao',label:'Descrição',required:true},
        {name:'valor',label:'Valor (R$)',type:'money',required:true,half:true},
        {name:'data',label:'Data',type:'date',required:true,half:true},
        {name:'accountId',label:'Conta',type:'select',required:true,options:UI.opts('accounts',{blank:false}),half:true},
        {name:'toAccountId',label:'Destino (só transferência)',type:'select',options:UI.opts('accounts'),half:true},
        {name:'categoryId',label:'Categoria',type:'select',options:UI.opts('categories',{blank:'— sem categoria —'})},
        {name:'personId',label:'Pessoa',type:'select',options:UI.opts('people',{blank:'— não definido —'})},
        {name:'observacao',label:'Observação',type:'textarea'}
      ],
      extraFoot:t?`<button class="btn btn-d" id="delt" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){ t?DB.update('transactions',t.id,v):DB.insert('transactions',v);
        UI.close();render();UI.toast(t?'Atualizado ✓':'Lançado ✓'); }});
    if(t) $('#delt').onclick=()=>{UI.close();UI.confirm('Excluir este lançamento?',
      ()=>{DB.remove('transactions',t.id);render();UI.toast('Excluído');});};
  },
  recurrence(id){
    const r=id?DB.get('recurrences',id):null;
    if(!DB.all('accounts').length&&!DB.all('cards').length){
      UI.toast('Cadastre uma conta ou cartão primeiro'); go('cfg'); return; }
    UI.form({
      title:r?'Editar conta recorrente':'Nova conta recorrente',
      submitLabel:r?'Salvar':'Criar',
      values:r||{tipo:'despesa',frequencia:'mensal',diaVencimento:10,inicio:curYM(),fim:'',
        ativo:true,auto:false,personId:(DB.all('people').find(x=>x.isOwner)||{}).id},
      fields:[
        {name:'tipo',label:'Tipo',type:'select',required:true,options:[
          {v:'despesa',t:'Saída — conta fixa a pagar'},{v:'receita',t:'Entrada — receita fixa'}]},
        {name:'descricao',label:'Descrição',required:true,placeholder:'Ex.: Aluguel, Salário, Netflix'},
        {name:'valor',label:'Valor (R$)',type:'money',required:true,half:true},
        {name:'diaVencimento',label:'Dia do mês',type:'number',min:1,half:true},
        {name:'frequencia',label:'Repete a cada',type:'select',half:true,options:[
          {v:'mensal',t:'Mês'},{v:'bimestral',t:'2 meses'},{v:'trimestral',t:'3 meses'},
          {v:'semestral',t:'6 meses'},{v:'anual',t:'12 meses'}]},
        {name:'categoryId',label:'Categoria',type:'select',half:true,options:UI.opts('categories',{blank:'— sem categoria —'})},
        {name:'accountId',label:'Conta',type:'select',half:true,options:UI.opts('accounts',{blank:'— nenhuma —'})},
        {name:'cardId',label:'Ou cartão',type:'select',half:true,options:UI.opts('cards',{blank:'— nenhum —'}),
          hint:'Se escolher cartão, a conta é ignorada'},
        {name:'personId',label:'Responsável',type:'select',options:UI.opts('people',{blank:'— não definido —'})},
        {name:'inicio',label:'Começa em',type:'month',required:true,half:true},
        {name:'fim',label:'Termina em (opcional)',type:'month',half:true,hint:'Vazio = sem prazo'},
        {name:'auto',label:'Lançar automaticamente todo mês',type:'checkbox',
          hint:'Desmarcado: aparece como pendente para você confirmar'},
        {name:'ativo',label:'Ativa',type:'checkbox'},
        {name:'observacao',label:'Observação',type:'textarea'}
      ],
      extraFoot:r?`<button class="btn btn-d" id="delr" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){
        if(!v.accountId&&!v.cardId){UI.toast('Escolha uma conta ou um cartão');return;}
        if(v.cardId) v.accountId='';
        v.inicio=(v.inicio||curYM()).slice(0,7);
        v.fim=v.fim?v.fim.slice(0,7):'';
        v.diaVencimento=Math.min(31,Math.max(1,Number(v.diaVencimento)||1));
        if(r) DB.update('recurrences',r.id,v); else DB.insert('recurrences',{...v,skips:[]});
        Recur.autoRun(); UI.close(); render(); UI.toast('Recorrência salva ✓');
      }});
    if(r) $('#delr').onclick=()=>{UI.close();
      UI.confirm(`Excluir "${r.descricao}"? Os lançamentos já confirmados continuam no histórico.`,
        ()=>{DB.remove('recurrences',r.id);render();UI.toast('Excluída');});};
  },
  card(id){
    const c=id?DB.get('cards',id):null;
    UI.form({title:c?'Editar cartão':'Novo cartão',
      values:c||{diaFechamento:28,diaVencimento:5,cor:'#6D28D9',ativo:true},
      fields:[
        {name:'nome',label:'Nome do cartão',required:true,placeholder:'Ex.: Nubank, Inter Black'},
        {name:'bandeira',label:'Bandeira',half:true,placeholder:'Visa / Mastercard'},
        {name:'ultimos4',label:'Últimos 4 dígitos',half:true,placeholder:'0000'},
        {name:'limite',label:'Limite (R$)',type:'money',half:true},
        {name:'cor',label:'Cor',type:'color',half:true},
        {name:'diaFechamento',label:'Dia do fechamento',type:'number',min:1,half:true,
          hint:'Compras após esse dia caem na fatura seguinte'},
        {name:'diaVencimento',label:'Dia do vencimento',type:'number',min:1,half:true},
        {name:'contaId',label:'Conta que paga a fatura',type:'select',options:UI.opts('accounts')},
        {name:'ativo',label:'Cartão ativo',type:'checkbox'}
      ],
      extraFoot:c?`<button class="btn btn-d" id="delc" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){ c?DB.update('cards',c.id,v):DB.insert('cards',v);
        UI.close();render();UI.toast('Cartão salvo ✓'); }});
    if(c) $('#delc').onclick=()=>{UI.close();
      UI.confirm(`Excluir "${c.nome}"? As compras vinculadas também serão removidas.`,
        ()=>{DB.all('purchases').filter(p=>p.cardId===c.id).forEach(p=>DB.remove('purchases',p.id));
          DB.remove('cards',c.id);render();UI.toast('Excluído');});};
  },
  account(id){
    const a=id?DB.get('accounts',id):null;
    UI.form({title:a?'Editar conta':'Nova conta',
      values:a||{tipo:'corrente',cor:'#8B5CF6',saldoInicial:0,ativo:true},
      fields:[
        {name:'nome',label:'Nome',required:true,placeholder:'Ex.: Conta Corrente, Carteira'},
        {name:'tipo',label:'Tipo',type:'select',half:true,options:[
          {v:'corrente',t:'Conta corrente'},{v:'poupanca',t:'Poupança'},
          {v:'carteira',t:'Carteira / dinheiro'},{v:'investimento',t:'Investimento'}]},
        {name:'banco',label:'Banco',half:true},
        {name:'saldoInicial',label:'Saldo inicial (R$)',type:'money',half:true},
        {name:'cor',label:'Cor',type:'color',half:true},
        {name:'ativo',label:'Conta ativa',type:'checkbox'}
      ],
      extraFoot:a?`<button class="btn btn-d" id="dela" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){ a?DB.update('accounts',a.id,v):DB.insert('accounts',v);
        UI.close();render();UI.toast('Conta salva ✓'); }});
    if(a) $('#dela').onclick=()=>{UI.close();UI.confirm(`Excluir "${a.nome}"?`,
      ()=>{DB.remove('accounts',a.id);render();UI.toast('Excluída');});};
  },
  person(id){
    const p=id?DB.get('people',id):null;
    UI.form({title:p?'Editar pessoa':'Nova pessoa',values:p||{cor:'#DC2626',isOwner:false},
      fields:[
        {name:'nome',label:'Nome',required:true,placeholder:'Ex.: Mãe, Irmão, Cônjuge'},
        {name:'cor',label:'Cor',type:'color',half:true},
        {name:'telefone',label:'Telefone (opcional)',half:true},
        {name:'isOwner',label:'Sou eu (titular do cartão)',type:'checkbox',
          hint:'Marque só para você. Quem não é titular aparece na lista de quem te deve.'}
      ],
      extraFoot:p&&!p.isOwner?`<button class="btn btn-d" id="delpe" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){ p?DB.update('people',p.id,v):DB.insert('people',v);
        UI.close();render();UI.toast('Pessoa salva ✓'); }});
    if(p&&!p.isOwner) $('#delpe').onclick=()=>{UI.close();UI.confirm(`Excluir "${p.nome}"?`,
      ()=>{DB.remove('people',p.id);render();UI.toast('Excluída');});};
  },
  category(id){
    const c=id?DB.get('categories',id):null;
    UI.form({title:c?'Editar categoria':'Nova categoria',values:c||{tipo:'despesa',cor:'#6D28D9'},
      fields:[
        {name:'nome',label:'Nome',required:true},
        {name:'tipo',label:'Tipo',type:'select',half:true,options:[
          {v:'despesa',t:'Despesa'},{v:'receita',t:'Receita'}]},
        {name:'cor',label:'Cor',type:'color',half:true}
      ],
      extraFoot:c?`<button class="btn btn-d" id="delct" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){ c?DB.update('categories',c.id,v):DB.insert('categories',v);
        UI.close();render();UI.toast('Categoria salva ✓'); }});
    if(c) $('#delct').onclick=()=>{UI.close();UI.confirm(`Excluir "${c.nome}"?`,
      ()=>{DB.remove('categories',c.id);render();UI.toast('Excluída');});};
  },
  vault(id){
    const v0=id?DB.get('vaults',id):null;
    UI.form({title:v0?'Editar cofrinho':'Novo cofrinho',values:v0||{cor:'#10B981',icone:'🐷'},
      fields:[
        {name:'nome',label:'Nome',required:true,placeholder:'Ex.: Reserva de emergência, Viagem'},
        {name:'icone',label:'Emoji',half:true,placeholder:'🐷'},
        {name:'cor',label:'Cor',type:'color',half:true},
        {name:'metaValor',label:'Meta (R$)',type:'money',half:true},
        {name:'metaData',label:'Meta até',type:'date',half:true}
      ],
      extraFoot:v0?`<button class="btn btn-d" id="delv" style="margin-right:auto">Excluir</button>`:'',
      onSubmit(v){ v0?DB.update('vaults',v0.id,v):DB.insert('vaults',v);
        UI.close();render();UI.toast('Cofrinho salvo ✓'); }});
    if(v0) $('#delv').onclick=()=>{UI.close();
      UI.confirm(`Excluir "${v0.nome}" e seus movimentos?`,
        ()=>{DB.all('vaultMovements').filter(m=>m.vaultId===v0.id).forEach(m=>DB.remove('vaultMovements',m.id));
          DB.remove('vaults',v0.id);render();UI.toast('Excluído');});};
  },
  vaultMov(vaultId,dir){
    const v=DB.get('vaults',vaultId), accs=DB.all('accounts').filter(a=>!a.archived);
    if(!v)return;
    if(!accs.length){ UI.toast('Cadastre uma conta primeiro'); go('cfg'); return; }
    UI.form({
      title:(dir>0?'Guardar em ':'Resgatar de ')+v.nome,
      submitLabel:dir>0?'Guardar':'Resgatar',
      values:{data:todayISO(),accountId:accs[0].id},
      fields:[
        {name:'valor',label:'Valor (R$)',type:'money',required:true,half:true},
        {name:'data',label:'Data',type:'date',required:true,half:true},
        {name:'accountId',label:dir>0?'Sai de qual conta':'Volta para qual conta',type:'select',required:true,options:accs.map(a=>({v:a.id,t:a.nome}))},
        {name:'observacao',label:'Observação',placeholder:dir>0?'aporte do mês':'motivo do resgate'}
      ],
      onSubmit(x){
        const valor=Math.abs(Number(x.valor)||0), data=x.data||todayISO();
        if(valor<=0){ UI.toast('Informe um valor válido'); return; }
        if(dir<0&&valor>Model.vaultBalanceAt(vaultId,data)+0.009){ UI.toast('O cofrinho não possui saldo suficiente'); return; }
        const antes=Model.vaultBalance(vaultId);
        DB.insert('vaultMovements',{vaultId,data,valor:dir>0?valor:-valor,tipo:dir>0?'aporte':'resgate',accountId:x.accountId,legacy:false,observacao:x.observacao});

/* deslizar para trocar de mês (celular) */
let _sx=0,_sy=0;
document.addEventListener('touchstart',e=>{
  _sx=e.touches[0].clientX;_sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const t=e.changedTouches[0]; if(!t) return;
  const dx=t.clientX-_sx, dy=t.clientY-_sy;
  if(Math.abs(dx)<70||Math.abs(dy)>60) return;
  if(e.target.closest('.mstrip,.tw,.ov,select,input,textarea')) return;
  state.month=ymAdd(state.month,dx<0?1:-1); render();
},{passive:true});

/* teclado: ← → troca mês, T volta para hoje */
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('.ov')) return;
  if(e.key==='ArrowLeft'){state.month=ymAdd(state.month,-1);render();}
  else if(e.key==='ArrowRight'){state.month=ymAdd(state.month,1);render();}
  else if(e.key==='t'||e.key==='T'){state.month=curYM();render();}
});

(function migrate(){
  const d=DB.raw();
  d.budgets=Array.isArray(d.budgets)?d.budgets:[];
  d.personEvents=Array.isArray(d.personEvents)?d.personEvents:[];
  d.meta=d.meta||{};
  if(Number(d.meta.schema)>=5&&d.meta.engine==='consolidated')return;
  try{localStorage.setItem('finctrl.bak.pre-consolidado',JSON.stringify(d));}catch(e){}

  DB.all('purchases').forEach(p=>{
    if(!p.shareType)p=DB.update('purchases',p.id,{shareType:(DB.get('people',p.personId)||{}).isOwner===false?'other':'owner'})||p;
    if(p.shareType==='other'&&p.sharePct===undefined)DB.update('purchases',p.id,{sharePct:100});
    if(!Array.isArray(p.paid)){
      const n=Math.min(Math.max(0,Number(p.parcelasPagas)||0),Math.max(1,Number(p.numParcelas)||1));
      const paid=Array.from({length:n},(_,i)=>i+1);
      DB.update('purchases',p.id,{paid});
    }
  });
  DB.all('vaultMovements').forEach(m=>{
    if(m.legacy===undefined && m.accountId===undefined)
      DB.update('vaultMovements',m.id,{accountId:'',legacy:true});
  });
  d.meta.schema=5;d.meta.engine='consolidated';d.meta.updatedAt=Date.now();
  DB.replaceAll(d);
})();

state.day=state.day||'';

const Model={
  firstComp(p){
    const card=DB.get('cards',p.cardId);
    if(!p.dataCompra)return curYM();
    const [y,m,dd]=String(p.dataCompra).split('-').map(Number);
    const ym=`${y}-${String(m).padStart(2,'0')}`;
    return dd>(Number(card?.diaFechamento)||1)?ymAdd(ym,1):ym;
  },
  parcelsOf(p){
    const n=Math.max(1,Number(p.numParcelas)||1),card=DB.get('cards',p.cardId);
    const tot=Math.round((Number(p.valorTotal)||0)*100),base=Math.floor(tot/n),sobra=tot-base*n;
    const f0=this.firstComp(p);
    const set=Array.isArray(p.paid)?new Set(p.paid.map(Number)):
      new Set(Array.from({length:Math.min(n,Math.max(0,Number(p.parcelasPagas)||0))},(_,i)=>i+1));
    return Array.from({length:n},(_,idx)=>{const k=idx+1,comp=ymAdd(f0,idx),valor=(base+(k<=sobra?1:0))/100;
      return {purchaseId:p.id,cardId:p.cardId,personId:p.personId,categoryId:p.categoryId,descricao:p.descricao,
        local:p.local||'',shareType:p.shareType||'owner',sharePct:Number(p.sharePct)||0,n:k,de:n,comp,valor:r2(valor),
        venc:dateOf(comp,Number(card?.diaVencimento)||10),paga:set.has(k)};});
  },
  parcels(){return DB.all('purchases').flatMap(p=>this.parcelsOf(p));},
  parcelsIn(comp){return this.parcels().filter(i=>i.comp===comp);},
  togglePar(pid,n){
    const p=DB.get('purchases',pid);if(!p)return;
    const max=Math.max(1,Number(p.numParcelas)||1),k=Number(n);if(k<1||k>max)return;
    const set=new Set(Array.isArray(p.paid)?p.paid.map(Number):[]);
    set.has(k)?set.delete(k):set.add(k);
    const paid=Array.from(set).filter(x=>x>=1&&x<=max).sort((a,b)=>a-b);
    DB.update('purchases',pid,{paid,parcelasPagas:paid.length});
  },
  cardUsed(id){return r2(this.parcels().filter(i=>i.cardId===id&&!i.paga).reduce((s,i)=>s+i.valor,0));},
  invoice(cardId,comp){
    const itens=this.parcelsIn(comp).filter(i=>i.cardId===cardId);
    const total=r2(itens.reduce((s,i)=>s+i.valor,0));
    const pendente=r2(itens.filter(i=>!i.paga).reduce((s,i)=>s+i.valor,0));
    return {itens,total,totalOriginal:total,pendente,pago:r2(total-pendente),paga:itens.length>0&&pendente<=0.009};
  },
  accountBalance(id){
    const a=DB.get('accounts',id);if(!a)return 0;
    let s=Number(a.saldoInicial)||0;
    const hoje=todayISO(),before=t=>!t.data||t.data<=hoje;
    DB.all('transactions').forEach(t=>{
      if(!before(t)||t.accountId!==id)return;
      const v=Math.abs(Number(t.valor)||0);
      if(t.tipo==='receita'||t.tipo==='reembolso')s+=v;
      else if(t.tipo==='despesa'||t.tipo==='fatura'||t.tipo==='transferencia')s-=v;
      if(t.tipo==='transferencia'&&t.toAccountId===id)s+=v;
    });
    DB.all('settlements').forEach(x=>{if(x.accountId===id&&before(x))s+=Math.abs(Number(x.valor)||0);});
    DB.all('vaultMovements').forEach(m=>{if(m.accountId===id&&!Fin.isLegacyVault(m)&&before(m))s-=Number(m.valor)||0;});
    return r2(s);
  },
  totalBalance(){return r2(DB.all('accounts').filter(a=>a.ativo!==false&&!a.archived).reduce((s,a)=>s+this.accountBalance(a.id),0));},
  vaultBalanceAt(id,until=todayISO()){return r2(DB.all('vaultMovements').filter(m=>m.vaultId===id&&(!m.data||m.data<=until)).reduce((s,m)=>s+(Number(m.valor)||0),0));},
  vaultBalance(id){return this.vaultBalanceAt(id);},
  vaultTotal(){return r2(DB.all('vaults').filter(v=>!v.archived).reduce((s,v)=>s+this.vaultBalance(v.id),0));},
  monthSpend(comp){
    const cartao=r2(this.parcelsIn(comp).reduce((s,i)=>s+i.valor,0));
    const conta=r2(DB.all('transactions').filter(t=>t.tipo==='despesa'&&(t.data||'').slice(0,7)===comp).reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
    return {cartao,conta,total:r2(cartao+conta)};
  },
  monthIncome(comp){return r2(DB.all('transactions').filter(t=>t.tipo==='receita'&&(t.data||'').slice(0,7)===comp).reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));},
  byCategory(comp){
    const map={};const add=(id,v)=>{const k=id||'_';map[k]=(map[k]||0)+v;};
    this.parcelsIn(comp).forEach(i=>add(i.categoryId,i.valor));
    DB.all('transactions').filter(t=>t.tipo==='despesa'&&(t.data||'').slice(0,7)===comp).forEach(t=>add(t.categoryId,Math.abs(Number(t.valor)||0)));
    return Object.entries(map).map(([id,v])=>{const c=DB.get('categories',id);return {label:c?.nome||'Sem categoria',color:c?.cor||'#52525B',value:r2(v),id};}).sort((a,b)=>b.value-a.value);
  },
  peopleStats(comp){
    return DB.all('people').filter(p=>!p.archived).map(p=>{
      const ps=this.parcelsIn(comp).filter(i=>i.personId===p.id),rate=i=>p.isOwner?1:Share.rate(DB.get('purchases',i.purchaseId));
      const mes=r2(ps.reduce((s,i)=>s+i.valor*rate(i),0));
      const hist=this.parcels().filter(i=>i.personId===p.id);
      const ateHoje=r2(hist.filter(i=>i.venc<=todayISO()).reduce((s,i)=>s+i.valor*rate(i),0));
      const futuro=r2(hist.filter(i=>i.venc>todayISO()).reduce((s,i)=>s+i.valor*rate(i),0));
      const pago=r2(DB.all('settlements').filter(s=>s.personId===p.id).reduce((s,x)=>s+Math.abs(Number(x.valor)||0),0));
      const pagoMes=r2(DB.all('settlements').filter(s=>s.personId===p.id&&(s.data||'').slice(0,7)===comp).reduce((s,x)=>s+Math.abs(Number(x.valor)||0),0));
      return {...p,mes,ateHoje,futuro,pago,pagoMes,saldo:r2(ateHoje-pago)};
    });
  },
  purchaseDetail(id){
    const p=DB.get('purchases',id);if(!p)return null;const ps=this.parcelsOf(p),pg=ps.filter(i=>i.paga),ab=ps.filter(i=>!i.paga),today=todayISO();
    return {p,ps,card:DB.get('cards',p.cardId),pessoa:DB.get('people',p.personId),cat:DB.get('categories',p.categoryId),total:Number(p.valorTotal)||0,
      vlParcela:ps[0]?.valor||0,nPagas:pg.length,nAbertas:ab.length,nTotal:ps.length,pago:r2(pg.reduce((s,i)=>s+i.valor,0)),
      devedor:r2(ab.reduce((s,i)=>s+i.valor,0)),nVencidas:ab.filter(i=>i.venc<today).length,inicio:ps[0]?.comp||curYM(),fim:ps.at(-1)?.comp||curYM(),ehDivida:ab.length>0};
  },
  futureLoad(n=6){return Array.from({length:n},(_,k)=>{const comp=ymAdd(curYM(),k),ps=this.parcelsIn(comp).filter(i=>!i.paga);const terceiros=r2(ps.filter(i=>i.shareType!=='owner').reduce((s,i)=>s+i.valor,0));const meu=r2(ps.reduce((s,i)=>s+i.valor,0)-terceiros);return {comp,meu,terceiros,value:r2(meu+terceiros)};});},
  payInvoice(cardId,comp,pay=true){
    const card=DB.get('cards',cardId),pks=this.parcelsIn(comp).filter(i=>i.cardId===cardId);if(!card)return;
    const tag=DB.all('transactions').find(t=>t.tipo==='fatura'&&t.cardId===cardId&&t.comp===comp);
    if(pay){
      const pend=r2(pks.filter(i=>!i.paga).reduce((s,i)=>s+i.valor,0));
      const byPurchase={};pks.forEach(i=>(byPurchase[i.purchaseId]??=[]).push(i.n));
      Object.entries(byPurchase).forEach(([pid,nums])=>{const p=DB.get('purchases',pid);if(!p)return;const set=new Set(Array.isArray(p.paid)?p.paid.map(Number):[]);nums.forEach(n=>set.add(n));const paid=Array.from(set).sort((a,b)=>a-b);DB.update('purchases',pid,{paid,parcelasPagas:paid.length});});
      if(pend>0&&card.contaId&&!tag)
        DB.insert('transactions',{tipo:'fatura',cardId,comp,accountId:card.contaId,valor:pend,data:dateOf(comp,card.diaVencimento),descricao:`Fatura ${card.nome} · ${ymLb(comp)}`});
    }else if(tag){
      DB.remove('transactions',tag.id);
      pks.forEach(i=>{const p=DB.get('purchases',i.purchaseId);if(!p)return;const set=new Set(Array.isArray(p.paid)?p.paid.map(Number):[]);set.delete(i.n);const paid=Array.from(set).sort((a,b)=>a-b);DB.update('purchases',p.id,{paid,parcelasPagas:paid.length});});
    }
  }
};

const Fin={
  CLASSES:{
    receita:{lb:'Receita',grupo:'entrada',gasto:false,renda:true},
    despesa:{lb:'Despesa',grupo:'saida',gasto:true,renda:false},
    transferencia:{lb:'Transferência',grupo:'neutro',gasto:false,renda:false},
    fatura:{lb:'Pagamento de fatura',grupo:'liquidacao',gasto:false,renda:false},
    reembolso:{lb:'Reembolso',grupo:'neutro',gasto:false,renda:false},
    aporte:{lb:'Reserva',grupo:'reserva',gasto:false,renda:false},
    resgate:{lb:'Resgate',grupo:'reserva',gasto:false,renda:false},
    ajuste:{lb:'Ajuste',grupo:'neutro',gasto:false,renda:false}
  },
  classe(t){return this.CLASSES[t]||this.CLASSES.ajuste;},
  contaGasto(t){return !!this.classe(t).gasto;},
  contaRenda(t){return !!this.classe(t).renda;},
  isLegacyVault(m){return !!m&&(m.legacy===true||m.accountId===undefined);}
};
window.Fin=Fin;

const addD=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};

const Share={};
Share.rate=function(p){
  if(!p)return 0;
  if(p.shareType==='other')return 1;
  if(p.shareType==='split')return Math.min(1,Math.max(0,(Number(p.sharePct)||0)/100));
  return 0;
};
Share.events=function(pid){
  const ev=[],hoje=todayISO();
  DB.all('purchases').filter(p=>p.personId===pid).forEach(p=>{
    const r=Share.rate(p);if(r<=0)return;
    const c=DB.get('cards',p.cardId);
    Model.parcelsOf(p).forEach(i=>ev.push({
      data:i.venc,tipo:'compra',valor:r2(i.valor*r),desc:p.descricao||'Compra',
      sub:`${c?c.nome:'cartão'} · parcela ${i.n}/${i.de}`+(r<1?` · ${Math.round(r*100)}% dela`:'' )+(i.paga?' · fatura paga':''),
      ref:p.id,act:'pu-sched',futuro:i.venc>hoje
    }));
  });
  DB.all('settlements').filter(s=>s.personId===pid).forEach(s=>ev.push({
    data:s.data,tipo:'pagamento',valor:-Math.abs(Number(s.valor)||0),desc:'Pagamento recebido',
    sub:(s.observacao||'reembolso')+(s.accountId?` · ${DB.get('accounts',s.accountId)?.nome||''}`:''),
    ref:s.id,del:'st-del',futuro:(s.data||'')>hoje
  }));
  DB.all('personEvents').filter(e=>e.personId===pid).forEach(e=>ev.push({
    data:e.data,tipo:e.tipo,valor:Number(e.valor)||0,desc:e.tipo==='estorno'?'Estorno':'Ajuste',
    sub:e.obs||'lançado manualmente',ref:e.id,del:'pv-del',futuro:(e.data||'')>hoje
  }));
  ev.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  let saldo=0;ev.forEach(e=>{if(!e.futuro){saldo=r2(saldo+e.valor);e.saldo=saldo;}});
  return ev;
};
Share.ledger=function(pid){
  const ev=Share.events(pid),at=ev.filter(e=>!e.futuro),ft=ev.filter(e=>e.futuro);
  const devido=r2(at.filter(e=>e.valor>0).reduce((s,e)=>s+e.valor,0));
  const pago=r2(at.filter(e=>e.valor<0).reduce((s,e)=>s-e.valor,0));
  const saldo=r2(at.reduce((s,e)=>s+e.valor,0));
  return {devido,pago,saldo,futuro:r2(ft.reduce((s,e)=>s+Math.max(0,e.valor),0)),eventos:ev,atuais:at,futuros:ft,
    parcelas:Model.parcels().filter(i=>{const p=DB.get('purchases',i.purchaseId);return p&&p.personId===pid&&Share.rate(p)>0;}),
    pagamentos:DB.all('settlements').filter(s=>s.personId===pid).sort((a,b)=>(b.data||'').localeCompare(a.data||''))};
};
window.Share=Share;

const Budget={
  limitOf(c,m){
    const b=DB.all('budgets');
    const exact=b.find(x=>x.categoryId===c&&x.comp===m);if(exact)return Number(exact.valor)||0;
    const global=b.find(x=>x.categoryId===c&&(x.comp==='*'||!x.comp));return global?(Number(global.valor)||0):0;
  },
  set(c,v,m){
    const e=DB.all('budgets').find(x=>x.categoryId===c&&x.comp===m);
    if(v<=0){if(e)DB.remove('budgets',e.id);return;}
    e?DB.update('budgets',e.id,{valor:v}):DB.insert('budgets',{categoryId:c,valor:v,comp:m});
  },
  spent(c,m){
    const cartao=r2(Model.parcelsIn(m).filter(i=>i.categoryId===c).reduce((s,i)=>s+i.valor,0));
    const conta=r2(DB.all('transactions').filter(t=>t.tipo==='despesa'&&t.categoryId===c&&(t.data||'').slice(0,7)===m)
      .reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
    return r2(cartao+conta);
  },
  status(c,m){
    const limite=this.limitOf(c,m),gasto=this.spent(c,m),pct=limite?gasto/limite*100:0;
    return {catId:c,limite,gasto,restante:r2(limite-gasto),pct:r2(pct),
      nivel:!limite?'sem':pct>=100?'estourado':pct>=90?'critico':pct>=70?'atencao':'ok'};
  },
  all(m){return DB.all('categories').filter(c=>c.tipo==='despesa').map(c=>({...this.status(c.id,m),nome:c.nome,cor:c.cor}))
    .filter(x=>x.limite>0||x.gasto>0).sort((a,b)=>(b.limite?b.pct:-1)-(a.limite?a.pct:-1));}
};
window.Budget=Budget;

const Cash={
  events(dias=30){
    const h=todayISO(),lim=addD(h,dias),ev=[],seen=new Set();
    const push=(data,val,tipo,desc,sub,extra={})=>{
      if(!data||data<h||data>lim||!Number.isFinite(val)||Math.abs(val)<0.005)return;
      const key=`${tipo}|${data}|${desc}|${r2(val)}|${extra.id||''}`;if(seen.has(key))return;seen.add(key);
      ev.push({data,val:r2(val),tipo,desc,sub,...extra});
    };
    const meses=new Set([curYM(),ymAdd(curYM(),1),ymAdd(curYM(),2),ymAdd(curYM(),3),ymAdd(curYM(),4)]);
    meses.forEach(comp=>DB.all('cards').forEach(c=>{
      const inv=Model.invoice(c.id,comp);if(inv.pendente<=0)return;
      push(dateOf(comp,c.diaVencimento),-inv.pendente,'fatura',`Fatura ${c.nome}`,`${inv.itens.filter(i=>!i.paga).length} parcela(s) · ${ymLb(comp)}`,{cardId:c.id,comp});
    }));
    DB.all('transactions').filter(t=>t.data>h&&t.data<=lim&&t.tipo!=='transferencia'&&t.tipo!=='fatura').forEach(t=>{
      const v=Math.abs(Number(t.valor)||0),sg=(t.tipo==='receita'||t.tipo==='reembolso')?1:-1;
      push(t.data,sg*v,t.tipo,t.descricao||Fin.classe(t.tipo).lb,DB.get('accounts',t.accountId)?.nome||Fin.classe(t.tipo).lb,{id:t.id});
    });
    const maxMes=6;
    for(let k=0;k<=maxMes;k++){
      const comp=ymAdd(curYM(),k);
      Recur.month(comp).filter(i=>i.status==='pendente').forEach(i=>{
        if(i.r.cardId){
          const card=DB.get('cards',i.r.cardId);const fake={cardId:i.r.cardId,dataCompra:i.data};
          const f=Model.firstComp(fake),due=dateOf(f,card?.diaVencimento||10);
          push(due,i.r.tipo==='receita'?Math.abs(i.r.valor):-Math.abs(i.r.valor),i.r.tipo,
            i.r.descricao,i.r.tipo==='receita'?'entrada fixa':'conta fixa',{id:i.r.id});
        }else push(i.data,i.r.tipo==='receita'?Math.abs(i.r.valor):-Math.abs(i.r.valor),i.r.tipo,
          i.r.descricao,i.r.tipo==='receita'?'entrada fixa':'conta fixa',{id:i.r.id});
      });
    }
    DB.all('settlements').filter(s=>s.data>h&&s.data<=lim).forEach(s=>push(s.data,Math.abs(Number(s.valor)||0),'reembolso','Pagamento recebido',
      DB.get('people',s.personId)?.nome||'Pessoa',{id:s.id}));
    DB.all('vaultMovements').filter(m=>!Model.isLegacyVault(m)&&m.data>h&&m.data<=lim).forEach(m=>
      push(m.data,-(Number(m.valor)||0),m.valor>=0?'aporte':'resgate',DB.get('vaults',m.vaultId)?.nome||'Cofrinho',m.valor>=0?'aporte':'resgate',{id:m.id}));
    return ev.sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  },
  project(dias=30){
    const ev=this.events(dias),ini=Model.totalBalance();let saldo=ini,min=ini,minData=todayISO(),pts=[{data:todayISO(),saldo:ini}];
    ev.forEach(e=>{saldo=r2(saldo+e.val);pts.push({data:e.data,saldo,ev:e});if(saldo<min){min=saldo;minData=e.data;}});
    return {ini,fim:r2(saldo),entradas:r2(ev.filter(e=>e.val>0).reduce((s,e)=>s+e.val,0)),
      saidas:r2(ev.filter(e=>e.val<0).reduce((s,e)=>s-e.val,0)),min:r2(min),minData,risco:min<0,eventos:ev,pontos:pts,n:ev.length};
  },
  aReceber(){return r2(DB.all('people').filter(p=>!p.isOwner&&!p.archived).reduce((s,p)=>s+Math.max(0,Share.ledger(p.id).saldo),0));}
};
window.Cash=Cash;

Fin.snapshot=function(comp=state.month,dias=30){
  const contas=Model.totalBalance();
  const leg=r2(DB.all('vaultMovements').filter(Model.isLegacyVault).reduce((s,m)=>s+(Number(m.valor)||0),0));
  const reservado=Model.vaultTotal();
  const faturas=r2(DB.all('cards').reduce((s,c)=>{const i=Model.invoice(c.id,comp);return s+i.pendente;},0));
  const fixas=r2(Recur.previsto(comp).saida);
  const comprometido=r2(faturas+fixas);
  const atual=comp===curYM();
  const pj=atual?Cash.project(dias):{fim:contas,min:contas,minData:todayISO(),risco:false};
  const disponivel=atual?r2(contas-Math.max(0,leg)-comprometido):null;
  return {contas,reservado,legado:Math.max(0,leg),faturas,fixas,comprometido,disponivel,
    projetado:pj.fim,minimo:pj.min,minData:pj.minData,risco:pj.risco,patrimonio:r2(contas+reservado-leg),dias,atual};
};

Fin.dre=function(comp){
  const tx=DB.all('transactions').filter(t=>(t.data||'').slice(0,7)===comp);
  const receita=r2(tx.filter(t=>Fin.contaRenda(t.tipo)).reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
  const despConta=r2(tx.filter(t=>Fin.contaGasto(t.tipo)).reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
  const despCartao=r2(Model.parcelsIn(comp).reduce((s,i)=>s+i.valor,0));
  const gasto=r2(despConta+despCartao),mov=DB.all('vaultMovements').filter(m=>(m.data||'').slice(0,7)===comp);
  const aportes=r2(mov.filter(m=>m.valor>0).reduce((s,m)=>s+Math.abs(Number(m.valor)||0),0));
  const resgates=r2(mov.filter(m=>m.valor<0).reduce((s,m)=>s+Math.abs(Number(m.valor)||0),0));
  const reservaLiq=r2(aportes-resgates),fatPago=r2(tx.filter(t=>t.tipo==='fatura').reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
  const transf=r2(tx.filter(t=>t.tipo==='transferencia').reduce((s,t)=>s+Math.abs(Number(t.valor)||0),0));
  const reembolso=r2(DB.all('settlements').filter(s=>(s.data||'').slice(0,7)===comp).reduce((s,x)=>s+Math.abs(Number(x.valor)||0),0));
  const resultado=r2(receita-gasto);
  return {comp,receita,gasto,despConta,despCartao,resultado,aportes,resgates,reservaLiq,fatPago,transf,reembolso,
    taxaPoupanca:receita>0?r2(reservaLiq/receita*100):0,taxaSobra:receita>0?r2(resultado/receita*100):0,
    sobraNaoReservada:r2(resultado-reservaLiq)};
};

window.exportCSV=function(){
  const m=state.month,d=Fin.dre(m),R=[['Classificacao','ContaGasto','Tipo','Data','Vencimento','Descricao','Estabelecimento','Pessoa','Categoria','Origem','Parcela','Valor','Status']];
  Model.parcelsIn(m).forEach(i=>{const p=DB.get('purchases',i.purchaseId),pe=DB.get('people',i.personId),c=DB.get('categories',i.categoryId),cd=DB.get('cards',i.cardId);
    R.push(['Despesa','SIM','Compra no cartao',p?.dataCompra||'',i.venc,i.descricao||'',i.local||'',pe?.nome||'',c?.nome||'',cd?.nome||'',`${i.n}/${i.de}`,String(i.valor).replace('.',','),i.paga?'paga':'aberta']);});
  DB.all('transactions').filter(t=>(t.data||'').slice(0,7)===m).forEach(t=>{const cl=Fin.classe(t.tipo),pe=DB.get('people',t.personId),c=DB.get('categories',t.categoryId),a=DB.get('accounts',t.accountId);
    R.push([cl.grupo==='entrada'?'Receita':cl.grupo==='saida'?'Despesa':cl.lb,cl.gasto||cl.renda?'SIM':'NAO',cl.lb,t.data,t.data,t.descricao||'','',pe?.nome||'',c?.nome||'',a?.nome||'','',String(t.valor).replace('.',','),'']);});
  DB.all('vaultMovements').filter(v=>(v.data||'').slice(0,7)===m).forEach(v=>{const cf=DB.get('vaults',v.vaultId),a=DB.get('accounts',v.accountId);R.push(['Reserva','NAO',v.valor>=0?'Aporte':'Resgate',v.data,v.data,cf?.nome||'Cofrinho','','','',a?.nome||'','',String(Math.abs(v.valor)).replace('.',','),Fin.isLegacyVault(v)?'sem conta':'vinculado']);});
  DB.all('settlements').filter(s=>(s.data||'').slice(0,7)===m).forEach(s=>{const pe=DB.get('people',s.personId),a=DB.get('accounts',s.accountId);R.push(['Reembolso','NAO','Pagamento recebido',s.data,s.data,`Pagamento de ${pe?.nome||'—'}`,'',pe?.nome||'','',a?.nome||'','',String(s.valor).replace('.',','),'']);});
  R.push([]);R.push(['RESUMO']);[['Receitas',d.receita],['Despesas em conta',d.despConta],['Despesas no cartao',d.despCartao],['Gasto total',d.gasto],['Resultado',d.resultado],['Reserva liquida',d.reservaLiq],['Taxa de poupanca (%)',d.taxaPoupanca],['Pagamento de fatura (nao e gasto)',d.fatPago],['Transferencias (nao e gasto)',d.transf],['Reembolsos (nao e receita)',d.reembolso]].forEach(([k,v])=>R.push([k,'','','','','','','','','','',String(v).replace('.',','),'']));
  const csv='\uFEFF'+R.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n');dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),`finctrl-${m}.csv`);
};
ACT['csv']=()=>{exportCSV();UI.toast('CSV exportado ✓');};

/* inicialização */
const initialRoute = location.hash.slice(1);
state.route = V[initialRoute] ? initialRoute : 'dash';
render();
Recur.autoRun();
</script>
